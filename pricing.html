<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Choose Your Plan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Sound System Integration -->
  <script src="js/sound.js"></script>

  <style>
    /* AGGRESSIVE FORCE-FIT FULLSCREEN CSS RESET */
    html, body, #stage-wrapper, #stage, #bg-video {
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
      outline: none !important;
      box-sizing: border-box !important;
      overflow: hidden !important;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      background-color: #05041a !important;
      font-family: 'Baloo 2', 'Fredoka', 'Comic Sans MS', system-ui, sans-serif;
    }

    /* 1. FORCE-FIT STAGE WRAPPER CONTAINER */
    #stage-wrapper {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      background: #05041a !important;
      z-index: 0;
    }

    /* BACKGROUND IMAGE FALLBACK (OVERSIZED TO GUARANTEE ZERO GAPS) */
    #stage {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      width: 110vw !important;
      height: 110vh !important;
      height: 110dvh !important;
      min-width: 110% !important;
      min-height: 110% !important;
      transform: translate(-50%, -50%) scale(1.1) !important;
      background-image: url('assets/harga/dashboard/bg.jpg');
      background-size: cover !important;
      background-position: center center !important;
      background-repeat: no-repeat !important;
      z-index: 1;
    }

    /* 4. BACKGROUND VIDEO (OVERSIZED FORCE COVER SCALE - IMPOSSIBLE TO HAVE EMPTY SPACE) */
    #bg-video {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      width: 112vw !important;
      height: 112vh !important;
      height: 112dvh !important;
      min-width: 112% !important;
      min-height: 112% !important;
      /* Over-scaling forces video to bleed past screen borders on all 4 sides */
      transform: translate(-50%, -50%) scale(1.12) !important;
      object-fit: cover !important;
      pointer-events: none !important;
      z-index: 2;
    }

    /* INTERACTIVE CONTENT LAYER */
    #content-layer {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      z-index: 10;
      pointer-events: auto;
    }

    /* 2. PRELOADER LAYER & CONTINUE TRIGGER */
    #loader-layer {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      background: rgba(5, 4, 26, 0.96) !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #loader-spinner-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .spinner {
      width: 70px;
      height: 70px;
      border: 8px solid rgba(255, 255, 255, 0.15);
      border-top: 8px solid #FFC845;
      border-right: 8px solid #FF5C8A;
      border-bottom: 8px solid #5FE8FF;
      border-left: 8px solid #D9AFFF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #loader-text {
      color: #ffffff;
      font-size: 24px;
      font-weight: 700;
      margin-top: 24px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      letter-spacing: 1px;
    }

    #continue-btn {
      display: none;
      padding: 18px 48px;
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      background: linear-gradient(135deg, #FF5C8A, #5FE8FF);
      border: 3px solid #ffffff;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(95, 232, 255, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.6);
      animation: pulse 1.5s infinite;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: transform 0.2s ease;
    }

    #continue-btn:active {
      transform: scale(0.95);
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 92, 138, 0.7); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 22px rgba(255, 92, 138, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 92, 138, 0); }
    }

    /* 3. MODERN TOP-LEFT BACK BUTTON */
    #back-btn {
      position: absolute !important;
      top: 20px !important;
      left: 20px !important;
      width: 52px !important;
      height: 52px !important;
      border-radius: 50% !important;
      background: rgba(255, 255, 255, 0.25) !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.6) !important;
      color: #ffffff !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      font-size: 24px !important;
      cursor: pointer !important;
      z-index: 100;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    #back-btn:hover {
      transform: scale(1.1);
      background: rgba(255, 255, 255, 0.4) !important;
    }

    #back-btn:active {
      transform: scale(0.92);
    }

    /* CLOSE BUTTON */
    #close-btn {
      -webkit-appearance: none;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
      position: absolute !important;
      border: none !important;
      outline: none !important;
      background: transparent !important;
      cursor: pointer !important;
      border-radius: 50% !important;
      z-index: 90;
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    #close-btn:hover { transform: scale(1.08); filter: brightness(1.2); }
    #close-btn:active { transform: scale(0.92); }

    /* SUBSCRIPTION CARD DESIGN BACKDROPS */
    .plan-card-panel {
      position: absolute;
      border-radius: 28px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55), inset 0 2px 4px rgba(255, 255, 255, 0.3);
      z-index: 5;
      pointer-events: none;
    }

    /* PLAN CARD OVERLAY ELEMENTS */
    .plan-el {
      position: absolute;
      pointer-events: none;
      z-index: 12;
    }

    .plan-name {
      font-weight: 800;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      text-shadow: 0 0 12px currentColor, 0 2px 6px rgba(0,0,0,0.8);
      font-size: clamp(12px, 1.5vw, 23px);
    }

    .plan-sub {
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.02em;
      white-space: nowrap;
      font-size: clamp(9px, 0.8vw, 13px);
      background: rgba(0, 0, 0, 0.35);
      padding: 2px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .plan-price {
      color: #fff;
      text-align: center;
      font-weight: 800;
      white-space: nowrap;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .plan-price .amount { font-size: clamp(12px, 1.35vw, 21px); }
    .plan-price .period { font-size: clamp(8px, 0.78vw, 12px); font-weight: 600; opacity: 0.85; margin-left: 0.3em; }

    /* FEATURE CAPSULE DESIGN BEHIND TEXT */
    .plan-feature {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 0.4vw;
      pointer-events: none;
      z-index: 12;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 20px;
      padding: 3px 10px 3px 6px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
    }
    .plan-feature img {
      width: clamp(10px, 1.4vw, 20px);
      height: clamp(10px, 1.4vw, 20px);
      flex: none;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    .plan-feature span {
      color: #ffffff;
      font-size: clamp(8px, 0.78vw, 11.5px);
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      white-space: nowrap;
    }

    /* PLAN BUTTONS */
    .plan-btn {
      -webkit-appearance: none;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
      position: absolute;
      border: none;
      outline: none;
      border-radius: 999px;
      font-weight: 800;
      font-size: clamp(10px, 0.9vw, 15px);
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.45), inset 0 1.5px 3px rgba(255,255,255,0.6);
      transition: transform 0.12s ease, filter 0.12s ease;
      z-index: 15;
    }
    .plan-btn:hover { transform: scale(1.035); filter: brightness(1.08); }
    .plan-btn:active { transform: scale(0.96); filter: brightness(0.95); }

    /* 7. ANDROID & IOS MOBILE PHONE CARD SCALING */
    @media screen and (max-width: 600px), screen and (max-height: 500px) and (max-width: 930px) {
      .plan-name { font-size: clamp(11px, 2.0vw, 20px); }
      .plan-sub { font-size: clamp(8px, 1.1vw, 12px); }
      .plan-price .amount { font-size: clamp(11px, 1.8vw, 18px); }
      .plan-price .period { font-size: clamp(8px, 1.0vw, 11px); }
      .plan-feature span { font-size: clamp(8px, 1.0vw, 11px); }
      .plan-feature img { width: clamp(10px, 1.8vw, 18px); height: clamp(10px, 1.8vw, 18px); }
      .plan-btn { font-size: clamp(9px, 1.2vw, 14px); }

      .card-col-2 {
        left: calc(var(--base-left) - 1.5%) !important;
      }
      .card-col-3 {
        left: calc(var(--base-left) - 3%) !important;
      }
      .card-col-4 {
        left: calc(var(--base-left) - 4.5%) !important;
      }
    }

    /* TOAST NOTIFICATION */
    #toast {
      position: fixed !important;
      bottom: 35px !important;
      left: 50% !important;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.94);
      color: #FFEB3B;
      padding: 12px 32px;
      border-radius: 40px;
      font-size: 19px;
      font-weight: 800;
      border: 2px solid #FFEB3B;
      z-index: 1000;
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
      pointer-events: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      text-align: center;
      white-space: nowrap;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* 6. INTEGRATED AUTOPLAY MUSIC PLAYER WIDGET */
    #mw-reopen-btn {
      position: fixed !important;
      bottom: 20px !important;
      right: 20px !important;
      width: 50px !important;
      height: 50px !important;
      border-radius: 50% !important;
      background: linear-gradient(135deg, #FF5C8A, #7C4DFF);
      color: #ffffff;
      border: 2px solid #ffffff;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 500;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
    }

    #mw-reopen-btn:hover {
      transform: scale(1.15);
    }

    #music-widget {
      position: fixed !important;
      bottom: 20px !important;
      left: 50% !important;
      transform: translateX(-50%) translateY(0);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      padding: 10px 24px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 500;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
    }

    #music-widget.is-minimized {
      transform: translateX(-50%) translateY(150%);
      opacity: 0;
      pointer-events: none;
    }

    .mw-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1.5px solid rgba(255, 255, 255, 0.5);
      color: #ffffff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .mw-btn:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: scale(1.1);
    }

    #mw-track-info {
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>

    // DIMENSIONS FOR PERCENTAGE CONVERSIONS

      },

    const CLOSE_BOX = { left: 1405, top: 63, width: 66, height: 66 };

    function boxStyle(el, box) {
      const leftPct = pct(box.left, SRC_W);
      const topPct = pct(box.top, SRC_H);
      el.style.setProperty('--base-left', leftPct + '%');
      el.style.setProperty('--base-top', topPct + '%');
      el.style.left = leftPct + '%';
      el.style.top = topPct + '%';
      el.style.width = pct(box.width, SRC_W) + '%';
      el.style.height = pct(box.height, SRC_H) + '%';
    }

    // MATHEMATICALLY GUARANTEED FULLSCREEN VIDEO COVER PIPELINE
    function enforceFullScreenVideo() {
      const v = document.getElementById('bg-video');
      const stage = document.getElementById('stage');
      if (!v) return;

      const w = window.innerWidth || document.documentElement.clientWidth;
      const h = window.innerHeight || document.documentElement.clientHeight;

      const videoRatio = (v.videoWidth && v.videoHeight) ? (v.videoWidth / v.videoHeight) : (16 / 9);
      const screenRatio = w / h;

      // Calculate oversized dimensions to bleed past screen edges by at least 15%
      let targetW, targetH;
      if (screenRatio > videoRatio) {
        targetW = Math.ceil(w * 1.15);
        targetH = Math.ceil((w / videoRatio) * 1.15);
      } else {
        targetW = Math.ceil((h * videoRatio) * 1.15);
        targetH = Math.ceil(h * 1.15);
      }

      v.style.width = targetW + 'px';
      v.style.height = targetH + 'px';

      if (stage) {
        stage.style.width = targetW + 'px';
        stage.style.height = targetH + 'px';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const stageWrapper = document.getElementById('stage-wrapper');
      const contentLayer = document.getElementById('content-layer');
      const toast = document.getElementById('toast');
      const bgVideo = document.getElementById('bg-video');
      const loaderLayer = document.getElementById('loader-layer');
      const spinnerContainer = document.getElementById('loader-spinner-container');
      const continueBtn = document.getElementById('continue-btn');
      const backBtn = document.getElementById('back-btn');
      const closeBtn = document.getElementById('close-btn');

      let toastTimer = null;

      function showToast(msg) {
        clearTimeout(toastTimer);
        toast.textContent = msg;
        toast.classList.add('show');
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
      }

      // 4. BACKGROUND VIDEO MUTE LOCK & EARLY LOOP
      if (bgVideo) {
        bgVideo.muted = true;
        bgVideo.volume = 0;
        
        bgVideo.addEventListener('volumechange', () => {
          if (!bgVideo.muted || bgVideo.volume !== 0) {
            bgVideo.muted = true;
            bgVideo.volume = 0;
          }
        });

        bgVideo.addEventListener('timeupdate', () => {
          if (bgVideo.duration && bgVideo.currentTime >= bgVideo.duration - 1.0) {
            bgVideo.currentTime = 0.0;
          }
        });

        bgVideo.addEventListener('loadedmetadata', enforceFullScreenVideo);
        bgVideo.addEventListener('playing', enforceFullScreenVideo);

        bgVideo.addEventListener('error', () => {
          bgVideo.style.display = 'none';
        });
      }

      window.addEventListener('resize', enforceFullScreenVideo);
      window.addEventListener('orientationchange', enforceFullScreenVideo);
      enforceFullScreenVideo();
      setInterval(enforceFullScreenVideo, 500); // Continuous enforcement loop

      // RENDER SUBSCRIPTION PLAN CARDS WITH DESIGN BACKDROPS
      PLANS.forEach(plan => {
        // Design Backdrop Panel behind card content
        const panel = document.createElement('div');
        panel.className = `plan-card-panel ${plan.colClass}`;
        const panelLeft = pct(plan.btnBox.left - 12, SRC_W);
        const panelTop = pct(plan.nameBox.top - 18, SRC_H);
        const panelWidth = pct(plan.btnBox.width + 24, SRC_W);
        const panelHeight = pct(450, SRC_H);

        panel.style.setProperty('--base-left', panelLeft + '%');
        panel.style.setProperty('--base-top', panelTop + '%');
        panel.style.left = panelLeft + '%';
        panel.style.top = panelTop + '%';
        panel.style.width = panelWidth + '%';
        panel.style.height = panelHeight + '%';
        panel.style.background = plan.panelBg;
        panel.style.borderColor = plan.panelBorder;
        contentLayer.appendChild(panel);

        // Name
        const nameEl = document.createElement('div');
        nameEl.className = `plan-el plan-name ${plan.colClass}`;
        nameEl.textContent = plan.name;
        nameEl.style.color = plan.nameColor;
        boxStyle(nameEl, plan.nameBox);
        nameEl.style.display = 'flex';
        nameEl.style.alignItems = 'center';
        nameEl.style.justifyContent = 'center';
        contentLayer.appendChild(nameEl);

        // Subtitle
        const subEl = document.createElement('div');
        subEl.className = `plan-el plan-sub ${plan.colClass}`;
        subEl.textContent = plan.sub;
        subEl.style.color = plan.subColor;
        boxStyle(subEl, plan.subBox);
        subEl.style.display = 'flex';
        subEl.style.alignItems = 'center';
        subEl.style.justifyContent = 'center';
        contentLayer.appendChild(subEl);

        // Price
        const priceEl = document.createElement('div');
        priceEl.className = `plan-el plan-price ${plan.colClass}`;
        priceEl.innerHTML = `<span class="amount">${plan.price}</span><span class="period">${plan.period}</span>`;
        boxStyle(priceEl, plan.priceBox);
        priceEl.style.display = 'flex';
        priceEl.style.alignItems = 'baseline';
        priceEl.style.justifyContent = 'center';
        contentLayer.appendChild(priceEl);

        // Button
        const btn = document.createElement('button');
        btn.className = `plan-btn ${plan.colClass}`;
        btn.textContent = plan.btnLabel;
        btn.style.background = plan.btnGradient;
        btn.style.color = plan.btnTextColor;
        boxStyle(btn, plan.btnBox);
        btn.setAttribute('aria-label', plan.name + ' - ' + plan.btnLabel);

        // Sound & Click events
        btn.addEventListener('mouseenter', () => getSound()?.playHover?.());
        btn.addEventListener('click', () => {
          getSound()?.playClick?.();
          showToast(plan.name + ' plan selected!');
        });
        contentLayer.appendChild(btn);

        // Feature list items with capsule design
        plan.features.forEach((feat, i) => {
          const row = document.createElement('div');
          row.className = `plan-feature ${plan.colClass}`;
          const leftPct = pct(plan.featTextLeft - 22, SRC_W);
          const topPct = pct(plan.featTop + i * plan.featLineHeight, SRC_H);
          row.style.setProperty('--base-left', leftPct + '%');
          row.style.setProperty('--base-top', topPct + '%');
          row.style.left = leftPct + '%';
          row.style.top = topPct + '%';
          row.innerHTML = `<img src="${plan.checkIcon}" alt=""><span>${feat}</span>`;
          contentLayer.appendChild(row);
        });
      });

      // Close button positioning & behavior
      boxStyle(closeBtn, CLOSE_BOX);
      closeBtn.addEventListener('mouseenter', () => getSound()?.playHover?.());
      closeBtn.addEventListener('click', () => {
        getSound()?.playClick?.();
        showToast('Closed');
      });

      // 3. BACK BUTTON
      backBtn.addEventListener('mouseenter', () => getSound()?.playHover?.());
      backBtn.addEventListener('click', () => {
        getSound()?.playClick?.();
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = 'index.html';
        }
      });

      // 2. ASSET PRELOADER ENGINE
      const assetsToLoad = [
        'assets/harga/dashboard/bg.jpg',
        'assets/harga/dashboard/check_orange.png',
        'assets/harga/dashboard/check_red.png',
        'assets/harga/dashboard/check_blue.png',
        'assets/harga/dashboard/check_purple.png'
      ];

      let loadedCount = 0;
      const totalAssets = assetsToLoad.length;

      function checkAllLoaded() {
        loadedCount++;
        if (loadedCount >= totalAssets) {
          if (spinnerContainer) spinnerContainer.style.display = 'none';
          if (continueBtn) continueBtn.style.display = 'inline-block';
        }
      }

      assetsToLoad.forEach(src => {
        const img = new Image();
        img.onload = checkAllLoaded;
        img.onerror = checkAllLoaded;
        img.src = src;
      });

      // Preloader Continue Button Trigger
      continueBtn.addEventListener('click', () => {
        getSound()?.playClick?.();

        // Native Fullscreen Trigger
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }

        enforceFullScreenVideo();

        // Start Background Video Playback
        if (bgVideo) {
          bgVideo.play().catch(() => {});
        }

        // Start Music
        if (typeof window.startBgMusic === 'function') {
          window.startBgMusic();
        }

        // Fade Out Loader
        loaderLayer.style.opacity = '0';
        loaderLayer.style.visibility = 'hidden';
      });

      // 6. INTEGRATED AUTOPLAY MUSIC PLAYER WIDGET logic
      const musicAudio = document.getElementById('bg-music-audio');
      const musicWidget = document.getElementById('music-widget');
      const mwPlayBtn = document.getElementById('mw-play-btn');
      const mwNextBtn = document.getElementById('mw-next-btn');
      const mwMinimizeBtn = document.getElementById('mw-minimize-btn');
      const mwReopenBtn = document.getElementById('mw-reopen-btn');
      const mwTrackInfo = document.getElementById('mw-track-info');

      let playlist = [];
      let currentTrackIndex = 0;
      let hideWidgetTimer = null;

      const fallbackPlaylist = [
        { title: 'Kids Learning Melodies', src: 'assets/audio/music/track1.mp3' },
        { title: 'Happy Playtime', src: 'assets/audio/music/track2.mp3' }
      ];

      async function initPlaylist() {
        try {
          const res = await fetch('assets/harga/dashboard/music/playlist.json');
          if (res.ok) {
            playlist = await res.json();
          } else {
            throw new Error('Local playlist not found');
          }
        } catch (e1) {
          try {
            const res2 = await fetch('assets/audio/music/playlist.json');
            if (res2.ok) {
              playlist = await res2.json();
            } else {
              throw new Error('Global playlist not found');
            }
          } catch (e2) {
            playlist = fallbackPlaylist;
          }
        }
        if (playlist && playlist.length > 0) {
          loadTrack(0);
        }
      }

      function loadTrack(index) {
        if (!playlist || playlist.length === 0) return;
        currentTrackIndex = index % playlist.length;
        const track = playlist[currentTrackIndex];
        mwTrackInfo.textContent = track.title || `Track ${currentTrackIndex + 1}`;
        musicAudio.src = track.src;
        musicAudio.load();
      }

      function playTrackAtIndex(index) {
        loadTrack(index);
        const playPromise = musicAudio.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            mwPlayBtn.textContent = '⏸';
          }).catch(() => {
            mwPlayBtn.textContent = '▶';
          });
        }
      }

      window.startBgMusic = function() {
        if (!musicAudio.src && playlist.length > 0) {
          loadTrack(0);
        }
        musicAudio.muted = false;
        const playPromise = musicAudio.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            mwPlayBtn.textContent = '⏸';
          }).catch(() => {
            mwPlayBtn.textContent = '▶';
          });
        }
      };

      // Auto-Next Track Engine
      musicAudio.addEventListener('ended', () => {
        playTrackAtIndex(currentTrackIndex + 1);
      });

      // Widget Show/Hide Controls
      function resetWidgetTimer() {
        clearTimeout(hideWidgetTimer);
        hideWidgetTimer = setTimeout(() => {
          musicWidget.classList.add('is-minimized');
        }, 5000);
      }

      function showWidget() {
        musicWidget.classList.remove('is-minimized');
        resetWidgetTimer();
      }

      mwPlayBtn.addEventListener('click', () => {
        getSound()?.playClick?.();
        if (musicAudio.paused) {
          musicAudio.play();
          mwPlayBtn.textContent = '⏸';
        } else {
          musicAudio.pause();
          mwPlayBtn.textContent = '▶';
        }
        resetWidgetTimer();
      });

      mwNextBtn.addEventListener('click', () => {
        getSound()?.playClick?.();
        playTrackAtIndex(currentTrackIndex + 1);
        resetWidgetTimer();
      });

      mwMinimizeBtn.addEventListener('click', () => {
        getSound()?.playClick?.();
        musicWidget.classList.add('is-minimized');
      });

      mwReopenBtn.addEventListener('click', () => {
        getSound()?.playClick?.();
        showWidget();
      });

      // Hover near bottom reveal widget
      document.addEventListener('mousemove', (e) => {
        if (window.innerHeight - e.clientY <= 90) {
          showWidget();
        }
      });

      document.addEventListener('click', (e) => {
        if (e.target === stageWrapper || e.target === contentLayer) {
          showWidget();
        }
      });

      initPlaylist();
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Choose Your Plan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Sound System Integration -->
  <script src="js/sound.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #05041a;
      font-family: 'Baloo 2', 'Fredoka', 'Comic Sans MS', system-ui, -apple-system, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    /* 1. FULL-SCREEN & DYNAMIC AUTO-FIT RESPONSIVENESS */
    #stage-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #05041a;
    }

    #stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-image: url('assets/harga/dashboard/bg.jpg');
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 1;
      overflow: hidden;
    }

    /* BACKGROUND VIDEO */
    #bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      object-fit: fill;
      pointer-events: none;
      z-index: 2;
    }

    #content-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 3;
      pointer-events: auto;
    }

    /* PRELOADER LAYER */
    #loader-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: rgba(5, 4, 26, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #loader-spinner-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .spinner {
      width: 70px;
      height: 70px;
      border: 8px solid rgba(255, 255, 255, 0.15);
      border-top: 8px solid #FFC845;
      border-right: 8px solid #FF5C8A;
      border-bottom: 8px solid #5FE8FF;
      border-left: 8px solid #D9AFFF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #loader-text {
      color: #ffffff;
      font-size: 24px;
      font-weight: 700;
      margin-top: 24px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      letter-spacing: 1px;
    }

    #continue-btn {
      display: none;
      padding: 18px 48px;
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      background: linear-gradient(135deg, #FF5C8A, #5FE8FF);
      border: 3px solid #ffffff;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(95, 232, 255, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.6);
      animation: pulse 1.5s infinite;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: transform 0.2s ease;
    }

    #continue-btn:active {
      transform: scale(0.95);
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 92, 138, 0.7); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 22px rgba(255, 92, 138, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 92, 138, 0); }
    }

    /* NAVIGATION BUTTONS (WITH IOS SAFE-AREA SUPPORT) */
    #back-btn {
      position: absolute;
      top: max(20px, env(safe-area-inset-top));
      left: max(20px, env(safe-area-inset-left));
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.6);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    #back-btn:hover {
      transform: scale(1.1);
      background: rgba(255, 255, 255, 0.4);
    }

    #back-btn:active {
      transform: scale(0.92);
    }

    #close-btn {
      -webkit-appearance: none;
      appearance: none;
      position: absolute;
      border: none;
      outline: none;
      background: transparent;
      cursor: pointer;
      border-radius: 50%;
      z-index: 90;
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    #close-btn:hover { transform: scale(1.08); filter: brightness(1.2); }
    #close-btn:active { transform: scale(0.92); }

    /* PLAN CARD OVERLAY ELEMENTS */
    .plan-el {
      position: absolute;
      pointer-events: none;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* 1. PLAN NAME / CATEGORY (MOBILE DEFAULT SIZES) */
    .plan-name {
      font-weight: 800;
      line-height: 1.1;
      text-align: center;
      white-space: nowrap;
      text-shadow: 0 0 10px currentColor, 0 2px 5px rgba(0,0,0,0.7);
      font-size: clamp(12px, 1.55vw, 20px);
    }

    /* 2. SUBTITLE */
    .plan-sub {
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.02em;
      white-space: nowrap;
      font-size: clamp(9px, 0.95vw, 13px);
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* 3. PRICE DISPLAY */
    .plan-price {
      color: #fff;
      text-align: center;
      font-weight: 800;
      white-space: nowrap;
      text-shadow: 0 2px 4px rgba(0,0,0,0.7);
      display: flex;
      align-items: baseline;
      justify-content: center;
    }
    .plan-price .amount { font-size: clamp(12px, 1.45vw, 20px); font-weight: 800; }
    .plan-price .period { font-size: clamp(8px, 0.85vw, 13px); font-weight: 600; opacity: 0.9; margin-left: 0.25em; }

    /* 4. PLAN BUTTONS */
    .plan-btn {
      -webkit-appearance: none;
      appearance: none;
      position: absolute;
      border: none;
      outline: none;
      border-radius: 999px;
      font-weight: 800;
      font-size: clamp(10px, 1.05vw, 15px);
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.6);
      transition: transform 0.12s ease, filter 0.12s ease;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1;
      letter-spacing: 0.02em;
    }
    .plan-btn:hover { transform: scale(1.04); filter: brightness(1.1); }
    .plan-btn:active { transform: scale(0.95); filter: brightness(0.92); }

    /* 5. CONTENT FEATURE ITEMS (CLEAN FLEXBOX ALIGNMENT) */
    .plan-feature {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      pointer-events: none;
      z-index: 10;
      box-sizing: border-box;
    }
    .plan-feature img {
      width: clamp(11px, 1.25vw, 22px);
      height: clamp(11px, 1.25vw, 22px);
      flex-shrink: 0;
      object-fit: contain;
    }
    .plan-feature span {
      color: #ffffff;
      font-size: clamp(8.5px, 0.9vw, 13px);
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 6. PC & TABLET ENHANCED TEXT SIZES */
    @media screen and (min-width: 768px) and (min-height: 500px) {
      .plan-name { font-size: clamp(17px, 1.8vw, 30px); }
      .plan-sub { font-size: clamp(11px, 1.1vw, 17px); }
      .plan-price .amount { font-size: clamp(17px, 1.85vw, 30px); }
      .plan-price .period { font-size: clamp(10px, 1.0vw, 16px); }
      .plan-btn { font-size: clamp(13px, 1.25vw, 20px); }
      .plan-feature { gap: 8px; }
      .plan-feature img { width: clamp(14px, 1.4vw, 24px); height: clamp(14px, 1.4vw, 24px); }
      .plan-feature span { font-size: clamp(11px, 1.05vw, 16px); }
    }

    /* TOAST NOTIFICATION */
    #toast {
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.94);
      color: #FFEB3B;
      padding: 12px 32px;
      border-radius: 40px;
      font-size: 19px;
      font-weight: 800;
      border: 2px solid #FFEB3B;
      z-index: 1000;
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
      pointer-events: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      text-align: center;
      white-space: nowrap;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* MUSIC WIDGET CONTROLS */
    #mw-reopen-btn {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom));
      right: max(20px, env(safe-area-inset-right));
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FF5C8A, #7C4DFF);
      color: #ffffff;
      border: 2px solid #ffffff;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 500;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
    }

    #mw-reopen-btn:hover {
      transform: scale(1.15);
    }

    #music-widget {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(0);
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      padding: 10px 24px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 500;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
    }

    #music-widget.is-minimized {
      transform: translateX(-50%) translateY(150%);
      opacity: 0;
      pointer-events: none;
    }

    .mw-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1.5px solid rgba(255, 255, 255, 0.5);
      color: #ffffff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .mw-btn:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: scale(1.1);
    }

    #mw-track-info {
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <!-- PRELOADER LAYER -->
  <div id="loader-layer">
    <div id="loader-spinner-container">
      <div class="spinner"></div>
      <div id="loader-text">Loading Fun...</div>
    </div>
    <button id="continue-btn">CONTINUE ▶</button>
  </div>

  <!-- MAIN STAGE WRAPPER -->
  <div id="stage-wrapper">
    <!-- BACKGROUND VIDEO -->
    <video id="bg-video" autoplay muted playsinline webkit-playsinline loop preload="auto">
      <source src="assets/harga/dashboard/bg.mp4" type="video/mp4">
      <source src="assets/harga/dashboard/bg.webm" type="video/webm">
    </video>

    <!-- STAGE CONTAINER -->
    <div id="stage">
      <!-- CONTENT LAYER -->
      <div id="content-layer">
        <!-- MODERN BACK BUTTON -->
        <button id="back-btn" title="Go Back">◀</button>

        <!-- CLOSE BUTTON -->
        <button id="close-btn" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast">Coming Soon! 🚀</div>

  <!-- MUSIC WIDGET REOPEN BUTTON -->
  <button id="mw-reopen-btn" title="Music Player">🎵</button>

  <!-- FLOATING MUSIC PLAYER WIDGET -->
  <div id="music-widget" class="is-minimized">
    <button id="mw-play-btn" class="mw-btn">⏸</button>
    <div id="mw-track-info">Loading Music...</div>
    <button id="mw-next-btn" class="mw-btn">⏭</button>
    <button id="mw-minimize-btn" class="mw-btn">✖</button>
  </div>

  <!-- AUDIO ELEMENT -->
  <audio id="bg-music-audio" preload="auto"></audio>

  <script>
    // SOUND SYSTEM INTEGRATION HELPER
    function getSound() {
      return window.SmartKiddoSound || null;
    }

    // REFERENCE DESIGN RESOLUTION
    const SRC_W = 1536, SRC_H = 1024;
    const pct = (px, total) => (px / total) * 100;

    /* 
      EXACT CENTER ALIGNMENT GEOMETRY FOR ALL CARDS:
      Col 1 Center = 270.0px (17.578%)
      Col 2 Center = 587.5px (38.249%)
      Col 3 Center = 922.5px (60.059%)
      Col 4 Center = 1230.0px (80.078%)
    */
    const PLANS = [
      {
        id: 'little-spark',
        name: 'Little Spark', nameColor: '#FFC845',
        sub: '(FREE)', subColor: '#FFD873',
        price: 'RM0', period: '/month',
        btnLabel: 'Always Free',
        btnGradient: 'linear-gradient(180deg,#FFDD6B,#F5A623)', btnTextColor: '#3A2600',
        checkIcon: 'assets/harga/dashboard/check_orange.png',
        features: ['Limited games & activities', 'Basic learning videos', 'Coloring pages', 'Daily learning goal (1)', 'Progress tracking'],
        center: 270,
        nameBox: { width: 280, top: 430, height: 40 },
        subBox: { width: 220, top: 477, height: 22 },
        priceBox: { width: 260, top: 512, height: 34 },
        btnBox: { width: 290, top: 556, height: 44 },
        featLeft: 135, featTop: 615, featWidth: 270, featLineHeight: 38
      },
      {
        id: 'ruby',
        name: 'Ruby', nameColor: '#FF5C8A',
        sub: '(BASIC)', subColor: '#FF8FAE',
        price: 'RM19.90', period: '/month',
        btnLabel: 'Choose Plan',
        btnGradient: 'linear-gradient(180deg,#FF7C9C,#E8365F)', btnTextColor: '#FFFFFF',
        checkIcon: 'assets/harga/dashboard/check_red.png',
        features: ['All in Little Spark', 'Unlimited games & activities', 'Interactive stories', 'Daily learning goal (3)', 'Progress tracking', 'Certificate of achievement'],
        center: 587.5,
        nameBox: { width: 280, top: 430, height: 40 },
        subBox: { width: 220, top: 477, height: 22 },
        priceBox: { width: 260, top: 512, height: 34 },
        btnBox: { width: 290, top: 556, height: 44 },
        featLeft: 452.5, featTop: 615, featWidth: 270, featLineHeight: 38
      },
      {
        id: 'sapphire',
        name: 'Sapphire', nameColor: '#5FE8FF',
        sub: '(INTERMEDIATE)', subColor: '#A0F0FF',
        price: 'RM34.90', period: '/month',
        btnLabel: 'Choose Plan',
        btnGradient: 'linear-gradient(180deg,#5FC6F7,#1E88E5)', btnTextColor: '#FFFFFF',
        checkIcon: 'assets/harga/dashboard/check_blue.png',
        features: ['All in Ruby', 'Advanced learning games', 'Personalized learning path', 'Daily learning goal (5)', 'Printable worksheets', 'Priority support'],
        center: 922.5,
        nameBox: { width: 280, top: 438, height: 40 },
        subBox: { width: 220, top: 485, height: 22 },
        priceBox: { width: 260, top: 520, height: 34 },
        btnBox: { width: 290, top: 564, height: 44 },
        featLeft: 787.5, featTop: 622, featWidth: 270, featLineHeight: 37.5
      },
      {
        id: 'diamond',
        name: 'Diamond', nameColor: '#D9AFFF',
        sub: '(ADVANCE)', subColor: '#EBD4FF',
        price: 'RM59.90', period: '/month',
        btnLabel: 'Choose Plan',
        btnGradient: 'linear-gradient(180deg,#C9A3F5,#8E44AD)', btnTextColor: '#FFFFFF',
        checkIcon: 'assets/harga/dashboard/check_purple.png',
        features: ['All in Sapphire', '1-on-1 learning insights', 'Premium stories & content', 'Daily learning goal (Unlimited)', 'Early access to new features', 'Priority support'],
        center: 1230,
        nameBox: { width: 280, top: 430, height: 40 },
        subBox: { width: 220, top: 477, height: 22 },
        priceBox: { width: 260, top: 512, height: 34 },
        btnBox: { width: 290, top: 556, height: 44 },
        featLeft: 1095, featTop: 618, featWidth: 270, featLineHeight: 36.5
      }
    ];

    const CLOSE_BOX = { left: 1405, top: 63, width: 66, height: 66 };

    function boxStyle(el, box) {
      el.style.left = pct(box.left, SRC_W) + '%';
      el.style.top = pct(box.top, SRC_H) + '%';
      el.style.width = pct(box.width, SRC_W) + '%';
      el.style.height = pct(box.height, SRC_H) + '%';
    }

    function boxCenteredStyle(el, centerPx, topPx, widthPx, heightPx) {
      const leftPx = centerPx - (widthPx / 2);
      el.style.left = pct(leftPx, SRC_W) + '%';
      el.style.top = pct(topPx, SRC_H) + '%';
      el.style.width = pct(widthPx, SRC_W) + '%';
      el.style.height = pct(heightPx, SRC_H) + '%';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const stage = document.getElementById('stage');
      const contentLayer = document.getElementById('content-layer');
      const toast = document.getElementById('toast');
      const bgVideo = document.getElementById('bg-video');
      const loaderLayer = document.getElementById('loader-layer');
      const spinnerContainer = document.getElementById('loader-spinner-container');
      const continueBtn = document.getElementById('continue-btn');
      const backBtn = document.getElementById('back-btn');
      const closeBtn = document.getElementById('close-btn');

      let toastTimer = null;

      function showToast(msg) {
        clearTimeout(toastTimer);
        toast.textContent = msg;
        toast.classList.add('show');
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
      }

      // BACKGROUND VIDEO AUTOPLAY LOCK FOR IOS/ANDROID
      if (bgVideo) {
        bgVideo.muted = true;
        bgVideo.volume = 0;
        
        bgVideo.addEventListener('volumechange', () => {
          if (!bgVideo.muted || bgVideo.volume !== 0) {
            bgVideo.muted = true;
            bgVideo.volume = 0;
          }
        });

        bgVideo.addEventListener('timeupdate', () => {
          if (bgVideo.duration && bgVideo.currentTime >= bgVideo.duration - 0.8) {
            bgVideo.currentTime = 0.0;
          }
        });
      }

      // RENDER ALL CARDS WITH MATHEMATICAL CENTERING
      PLANS.forEach(plan => {
        // 1. Plan Category Name
        const nameEl = document.createElement('div');
        nameEl.className = 'plan-el plan-name';
        nameEl.textContent = plan.name;
        nameEl.style.color = plan.nameColor;
        boxCenteredStyle(nameEl, plan.center, plan.nameBox.top, plan.nameBox.width, plan.nameBox.height);
        contentLayer.appendChild(nameEl);

        // 2. Subtitle
        const subEl = document.createElement('div');
        subEl.className = 'plan-el plan-sub';
        subEl.textContent = plan.sub;
        subEl.style.color = plan.subColor;
        boxCenteredStyle(subEl, plan.center, plan.subBox.top, plan.subBox.width, plan.subBox.height);
        contentLayer.appendChild(subEl);

        // 3. Price Display
        const priceEl = document.createElement('div');
        priceEl.className = 'plan-el plan-price';
        priceEl.innerHTML = `<span class="amount">${plan.price}</span><span class="period">${plan.period}</span>`;
        boxCenteredStyle(priceEl, plan.center, plan.priceBox.top, plan.priceBox.width, plan.priceBox.height);
        contentLayer.appendChild(priceEl);

        // 4. Action Button
        const btn = document.createElement('button');
        btn.className = 'plan-btn';
        btn.textContent = plan.btnLabel;
        btn.style.background = plan.btnGradient;
        btn.style.color = plan.btnTextColor;
        boxCenteredStyle(btn, plan.center, plan.btnBox.top, plan.btnBox.width, plan.btnBox.height);
        btn.setAttribute('aria-label', plan.name + ' - ' + plan.btnLabel);

        btn.addEventListener('mouseenter', () => getSound()?.playHover?.());
        btn.addEventListener('click', () => {
          getSound()?.playClick?.();
          showToast(plan.name + ' plan selected!');
        });
        contentLayer.appendChild(btn);

        // 5. Features Content Rows (Unified Left-Aligned Flexbox)
        plan.features.forEach((featText, i) => {
          const row = document.createElement('div');
          row.className = 'plan-feature';
          row.style.left = pct(plan.featLeft, SRC_W) + '%';
          row.style.top = pct(plan.featTop + (i * plan.featLineHeight), SRC_H) + '%';
          row.style.width = pct(plan.featWidth, SRC_W) + '%';
          row.innerHTML = `<img src="${plan.checkIcon}" alt="check"><span>${featText}</span>`;
          contentLayer.appendChild(row);
        });
      });

      // Close button positioning
      boxStyle(closeBtn, CLOSE_BOX);
      closeBtn.addEventListener('mouseenter', () => getSound()?.playHover?.());
      closeBtn.addEventListener('click', () => {
        getSound()?.playClick?.();
        showToast('Closed');
      });

      // Back Button Trigger
      backBtn.addEventListener('mouseenter', () => getSound()?.playHover?.());
      backBtn.addEventListener('click', () => {
        getSound()?.playClick?.();
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = 'index.html';
        }
      });

      // ASSET PRELOADER ENGINE
      const assetsToLoad = [
        'assets/harga/dashboard/bg.jpg',
        'assets/harga/dashboard/check_orange.png',
        'assets/harga/dashboard/check_red.png',
        'assets/harga/dashboard/check_blue.png',
        'assets/harga/dashboard/check_purple.png'
      ];

      let loadedCount = 0;
      const totalAssets = assetsToLoad.length;

      function checkAllLoaded() {
        loadedCount++;
        if (loadedCount >= totalAssets) {
          if (spinnerContainer) spinnerContainer.style.display = 'none';
          if (continueBtn) continueBtn.style.display = 'inline-block';
        }
      }

      assetsToLoad.forEach(src => {
        const img = new Image();
        img.onload = checkAllLoaded;
        img.onerror = checkAllLoaded;
        img.src = src;
      });

      // Continue Button
      continueBtn.addEventListener('click', () => {
        getSound()?.playClick?.();

        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }

        if (typeof window.startBgMusic === 'function') {
          window.startBgMusic();
        }

        loaderLayer.style.opacity = '0';
        loaderLayer.style.visibility = 'hidden';
      });

      // MUSIC WIDGET CONTROLS
      const musicAudio = document.getElementById('bg-music-audio');
      const musicWidget = document.getElementById('music-widget');
      const mwPlayBtn = document.getElementById('mw-play-btn');
      const mwNextBtn = document.getElementById('mw-next-btn');
      const mwMinimizeBtn = document.getElementById('mw-minimize-btn');
      const mwReopenBtn = document.getElementById('mw-reopen-btn');
      const mwTrackInfo = document.getElementById('mw-track-info');

      let playlist = [];
      let currentTrackIndex = 0;
      let hideWidgetTimer = null;

      const fallbackPlaylist = [
        { title: 'Kids Learning Melodies', src: 'assets/audio/music/track1.mp3' },
        { title: 'Happy Playtime', src: 'assets/audio/music/track2.mp3' }
      ];

      async function initPlaylist() {
        try {
          const res = await fetch('assets/harga/dashboard/music/playlist.json');
          if (res.ok) {
            playlist = await res.json();
          } else {
            throw new Error('Local playlist missing');
          }
        } catch (e1) {
          try {
            const res2 = await fetch('assets/audio/music/playlist.json');
            if (res2.ok) {
              playlist = await res2.json();
            } else {
              throw new Error('Global playlist missing');
            }
          } catch (e2) {
            playlist = fallbackPlaylist;
          }
        }
        if (playlist && playlist.length > 0) {
          loadTrack(0);
        }
      }

      function loadTrack(index) {
        if (!playlist || playlist.length === 0) return;
        currentTrackIndex = index % playlist.length;
        const track = playlist[currentTrackIndex];
        mwTrackInfo.textContent = track.title || `Track ${currentTrackIndex + 1}`;
        musicAudio.src = track.src;
        musicAudio.load();
      }

      function playTrackAtIndex(index) {
        loadTrack(index);
        const playPromise = musicAudio.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            mwPlayBtn.textContent = '⏸';
          }).catch(() => {
            mwPlayBtn.textContent = '▶';
          });
        }
      }

      window.startBgMusic = function() {
        if (!musicAudio.src && playlist.length > 0) {
          loadTrack(0);
        }
        musicAudio.muted = false;
        const playPromise = musicAudio.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            mwPlayBtn.textContent = '⏸';
          }).catch(() => {
            mwPlayBtn.textContent = '▶';
          });
        }
      };

      musicAudio.addEventListener('ended', () => {
        playTrackAtIndex(currentTrackIndex + 1);
      });

      function resetWidgetTimer() {
        clearTimeout(hideWidgetTimer);
        hideWidgetTimer = setTimeout(() => {
          musicWidget.classList.add('is-minimized');
        }, 5000);
      }

      function showWidget() {
        musicWidget.classList.remove('is-minimized');
        resetWidgetTimer();
      }

      mwPlayBtn.addEventListener('click', () => {
        getSound()?.playClick?.();
        if (musicAudio.paused) {
          musicAudio.play();
          mwPlayBtn.textContent = '⏸';
        } else {
          musicAudio.pause();
          mwPlayBtn.textContent = '▶';
        }
        resetWidgetTimer();
      });

      mwNextBtn.addEventListener('click', () => {
        getSound()?.playClick?.();
        playTrackAtIndex(currentTrackIndex + 1);
        resetWidgetTimer();
      });

      mwMinimizeBtn.addEventListener('click', () => {
        getSound()?.playClick?.();
        musicWidget.classList.add('is-minimized');
      });

      mwReopenBtn.addEventListener('click', () => {
        getSound()?.playClick?.();
        showWidget();
      });

      document.addEventListener('mousemove', (e) => {
        if (window.innerHeight - e.clientY <= 90) {
          showWidget();
        }
      });

      document.addEventListener('click', (e) => {
        if (e.target === stage || e.target === contentLayer) {
          showWidget();
        }
      });

      initPlaylist();
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Choose Your Plan</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05041a;
    font-family: 'Baloo 2', 'Comic Sans MS', system-ui, -apple-system, sans-serif;
  }

  /* ---------- Stage: locked to the source image aspect ratio (FIT / letterbox) ---------- */
  #stage-wrapper {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #05041a; /* sampled from the scene's own deep-space corner color */
    overflow: hidden;
  }

  #stage {
    position: relative;
    aspect-ratio: 1536 / 1024;
    width: 100%;
    height: 100%;
    max-width: calc(100vh * 1536 / 1024);
    max-height: calc(100vw * 1024 / 1536);
    background-image: url('assets/5tahun/pricing/bg.jpg'); /* fallback if the video is missing/still loading */
    background-size: 100% 100%;
    background-repeat: no-repeat;
    overflow: hidden;
  }

  /* ---------- Background video (optional — drop bg.mp4 into the assets folder to enable) ---------- */
  #bg-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    z-index: 0;
    pointer-events: none;
  }

  /* ---------- Plan card overlay elements ---------- */
  .plan-el {
    position: absolute;
    pointer-events: none;
  }

  .plan-name {
    font-weight: 800;
    line-height: 1;
    text-align: center;
    white-space: nowrap;
    text-shadow: 0 0 10px currentColor, 0 2px 4px rgba(0,0,0,0.6);
    font-size: 1.9vw;
  }

  .plan-sub {
    font-weight: 700;
    text-align: center;
    letter-spacing: 0.02em;
    white-space: nowrap;
    font-size: 0.95vw;
  }

  .plan-price {
    color: #fff;
    text-align: center;
    font-weight: 800;
    white-space: nowrap;
    text-shadow: 0 2px 4px rgba(0,0,0,0.6);
  }
  .plan-price .amount { font-size: 1.7vw; }
  .plan-price .period { font-size: 0.95vw; font-weight: 600; opacity: 0.85; margin-left: 0.3em; }

  .plan-feature {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 0.5vw;
    pointer-events: none;
  }
  .plan-feature img {
    width: 1.9vw;
    height: 1.9vw;
    flex: none;
  }
  .plan-feature span {
    color: #fff;
    font-size: 1vw;
    font-weight: 600;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    white-space: nowrap;
  }

  /* ---------- Plan button (real, clickable) ---------- */
  .plan-btn {
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
    position: absolute;
    border: none;
    outline: none;
    border-radius: 999px;
    font-weight: 800;
    font-size: 1.15vw;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.5);
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  .plan-btn:hover { transform: scale(1.035); filter: brightness(1.08); }
  .plan-btn:active { transform: scale(0.96); filter: brightness(0.95); }

  /* ---------- Close button (real, clickable) ---------- */
  #close-btn {
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
    position: absolute;
    border: none;
    outline: none;
    background: transparent;
    cursor: pointer;
    border-radius: 50%;
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  #close-btn:hover { transform: scale(1.08); filter: brightness(1.2); }
  #close-btn:active { transform: scale(0.92); }

  /* ---------- Toast ---------- */
  #toast {
    position: absolute;
    left: 50%;
    top: 4%;
    transform: translate(-50%, -20px);
    background: linear-gradient(180deg, #ffffff, #f0e9ff);
    color: #4a2a86;
    font-weight: 800;
    font-size: clamp(13px, 2vw, 22px);
    padding: 0.6em 1.3em;
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4), 0 0 0 4px rgba(255,255,255,0.4) inset;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    white-space: nowrap;
    z-index: 30;
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

  <div id="stage-wrapper">
    <div id="stage">
      <!-- Background video. Replace assets/5tahun/pricing/bg.mp4 with your clip (mp4 + webm recommended).
           If this fails to load or is removed, the #stage background-image (assets/5tahun/pricing/bg.jpg) shows instead. -->
      <video id="bg-video" autoplay muted loop playsinline poster="assets/5tahun/pricing/bg.jpg">
        <source src="assets/5tahun/pricing/bg.mp4" type="video/mp4">
        <source src="assets/5tahun/pricing/bg.webm" type="video/webm">
      </video>

      <div id="toast"></div>
      <button id="close-btn" aria-label="Close"></button>
      <!-- Plan cards injected by JS from PLANS data -->
    </div>
  </div>

<script>
  // All positions are percentages of the source image (1536 x 1024) —
  // edit PLANS below to change any plan's name, subtitle, price, button label, or features.
  const SRC_W = 1536, SRC_H = 1024;
  const pct = (px, total) => (px / total) * 100;

  const PLANS = [
    {
      id: 'little-spark',
      name: 'Little Spark', nameColor: '#FFC845',
      sub: '(FREE)', subColor: '#FFD873',
      price: 'RM0', period: '/month',
      btnLabel: 'Always Free',
      btnGradient: 'linear-gradient(180deg,#FFDD6B,#F5A623)', btnTextColor: '#3A2600',
      checkIcon: 'assets/5tahun/pricing/check_orange.png',
      features: ['Limited games & activities', 'Basic learning videos', 'Coloring pages', 'Daily learning goal (1)', 'Progress tracking'],
      nameBox: {left:135, top:430, width:275, height:40},
      subBox: {left:220, top:479, width:95, height:22},
      priceBox: {left:175, top:516, width:185, height:34},
      btnBox: {left:120, top:557, width:300, height:44},
      featIconLeft: 128, featTextLeft: 172, featTop: 615, featIconSize: 30, featLineHeight: 38,
    },
    {
      id: 'ruby',
      name: 'Ruby', nameColor: '#FF5C8A',
      sub: '(BASIC)', subColor: '#FF8FAE',
      price: 'RM19.90', period: '/month',
      btnLabel: 'Choose Plan',
      btnGradient: 'linear-gradient(180deg,#FF7C9C,#E8365F)', btnTextColor: '#FFFFFF',
      checkIcon: 'assets/5tahun/pricing/check_red.png',
      features: ['All in Little Spark', 'Unlimited games & activities', 'Interactive stories', 'Daily learning goal (3)', 'Progress tracking', 'Certificate of achievement'],
      nameBox: {left:525, top:430, width:110, height:40},
      subBox: {left:540, top:479, width:95, height:22},
      priceBox: {left:475, top:516, width:225, height:34},
      btnBox: {left:435, top:557, width:305, height:44},
      featIconLeft: 463, featTextLeft: 478, featTop: 615, featIconSize: 30, featLineHeight: 38,
    },
    {
      id: 'sapphire',
      name: 'Sapphire', nameColor: '#5FE8FF',
      sub: '(INTERMEDIATE)', subColor: '#A0F0FF',
      price: 'RM34.90', period: '/month',
      btnLabel: 'Choose Plan',
      btnGradient: 'linear-gradient(180deg,#5FC6F7,#1E88E5)', btnTextColor: '#FFFFFF',
      checkIcon: 'assets/5tahun/pricing/check_blue.png',
      features: ['All in Ruby', 'Advanced learning games', 'Personalized learning path', 'Daily learning goal (5)', 'Printable worksheets', 'Priority support'],
      nameBox: {left:835, top:440, width:175, height:40},
      subBox: {left:825, top:486, width:195, height:22},
      priceBox: {left:805, top:524, width:235, height:34},
      btnBox: {left:770, top:566, width:305, height:44},
      featIconLeft: 798, featTextLeft: 813, featTop: 620, featIconSize: 30, featLineHeight: 37.5,
      ribbon: true,
    },
    {
      id: 'diamond',
      name: 'Diamond', nameColor: '#D9AFFF',
      sub: '(ADVANCE)', subColor: '#EBD4FF',
      price: 'RM59.90', period: '/month',
      btnLabel: 'Choose Plan',
      btnGradient: 'linear-gradient(180deg,#C9A3F5,#8E44AD)', btnTextColor: '#FFFFFF',
      checkIcon: 'assets/5tahun/pricing/check_purple.png',
      features: ['All in Sapphire', '1-on-1 learning insights', 'Premium stories & content', 'Daily learning goal (Unlimited)', 'Early access to new features', 'Priority support'],
      nameBox: {left:1130, top:430, width:190, height:40},
      subBox: {left:1150, top:479, width:150, height:22},
      priceBox: {left:1120, top:518, width:230, height:34},
      btnBox: {left:1085, top:558, width:305, height:44},
      featIconLeft: 1123, featTextLeft: 1130, featTop: 622, featIconSize: 30, featLineHeight: 35.3,
    },
  ];

  const CLOSE_BOX = { left: 1405, top: 63, width: 66, height: 66 };

  const stage = document.getElementById('stage');
  const toast = document.getElementById('toast');
  let toastTimer = null;

  function showToast(msg) {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.classList.add('show');
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  function boxStyle(el, box) {
    el.style.left = pct(box.left, SRC_W) + '%';
    el.style.top = pct(box.top, SRC_H) + '%';
    el.style.width = pct(box.width, SRC_W) + '%';
    el.style.height = pct(box.height, SRC_H) + '%';
  }

  PLANS.forEach(plan => {
    // Name
    const nameEl = document.createElement('div');
    nameEl.className = 'plan-el plan-name';
    nameEl.textContent = plan.name;
    nameEl.style.color = plan.nameColor;
    boxStyle(nameEl, plan.nameBox);
    nameEl.style.display = 'flex';
    nameEl.style.alignItems = 'center';
    nameEl.style.justifyContent = 'center';
    stage.appendChild(nameEl);

    // Subtitle
    const subEl = document.createElement('div');
    subEl.className = 'plan-el plan-sub';
    subEl.textContent = plan.sub;
    subEl.style.color = plan.subColor;
    boxStyle(subEl, plan.subBox);
    subEl.style.display = 'flex';
    subEl.style.alignItems = 'center';
    subEl.style.justifyContent = 'center';
    stage.appendChild(subEl);

    // Price
    const priceEl = document.createElement('div');
    priceEl.className = 'plan-el plan-price';
    priceEl.innerHTML = `<span class="amount">${plan.price}</span><span class="period">${plan.period}</span>`;
    boxStyle(priceEl, plan.priceBox);
    priceEl.style.display = 'flex';
    priceEl.style.alignItems = 'baseline';
    priceEl.style.justifyContent = 'center';
    stage.appendChild(priceEl);

    // Button (real, clickable)
    const btn = document.createElement('button');
    btn.className = 'plan-btn';
    btn.textContent = plan.btnLabel;
    btn.style.background = plan.btnGradient;
    btn.style.color = plan.btnTextColor;
    boxStyle(btn, plan.btnBox);
    btn.setAttribute('aria-label', plan.name + ' - ' + plan.btnLabel);
    btn.addEventListener('click', () => showToast(plan.name + ' plan selected!'));
    stage.appendChild(btn);

    // Feature list
    plan.features.forEach((feat, i) => {
      const row = document.createElement('div');
      row.className = 'plan-feature';
      row.style.left = pct(plan.featTextLeft, SRC_W) + '%';
      row.style.top = pct(plan.featTop + i * plan.featLineHeight, SRC_H) + '%';
      row.innerHTML = `<img src="${plan.checkIcon}" alt=""><span>${feat}</span>`;
      // position icon slightly left of text via negative margin using icon's own left coord
      const iconOffsetPct = pct(plan.featTextLeft - plan.featIconLeft, SRC_W);
      row.querySelector('img').style.marginLeft = '-' + iconOffsetPct + '%';
      stage.appendChild(row);
    });
  });

  // Close button
  const closeBtn = document.getElementById('close-btn');
  boxStyle(closeBtn, CLOSE_BOX);
  closeBtn.addEventListener('click', () => {
    stage.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
    stage.style.opacity = '0';
    stage.style.transform = 'scale(0.96)';
    setTimeout(() => showToast('Closed'), 300);
  });

  // Background video graceful fallback
  const bgVideo = document.getElementById('bg-video');
  bgVideo.addEventListener('error', () => {
    if (bgVideo.error) bgVideo.style.display = 'none';
  });
</script>

</body>
</html>

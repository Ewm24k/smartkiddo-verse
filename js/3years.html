<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Let's Learn & Have Fun!</title>
<style>
  * { 
    box-sizing: border-box; 
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh; /* Dynamic viewport height for modern mobile web browsers */
    overflow: hidden;
    background: #0a0028;
    font-family: 'Baloo 2', 'Comic Sans MS', system-ui, -apple-system, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---------- Full Screen Stage Wrapper ---------- */
  #stage-wrapper {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #0a0028;
  }

  /* ---------- Full Screen Stage (Expands to fill device, no left/right gaps) ---------- */
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    background-image: url('assets/3tahun/dashboard/bg.jpg'); /* Fallback image */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    overflow: hidden;
  }

  /* ---------- Background Video Configuration ---------- */
  #bg-video {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    transform: translate(-50%, -50%);
    object-fit: cover; /* Guarantees 100% full screen coverage with no left/right spaces */
    object-position: center;
    z-index: 0;
    pointer-events: none; /* Prevents user click, pause, or stop interactions */
    user-select: none;
  }

  /* ---------- Card buttons ---------- */
  .card-btn {
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
    position: absolute;
    z-index: 1;
    border: none;
    outline: none;
    padding: 0;
    margin: 0;
    background-color: transparent;
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    cursor: pointer;
    transition: transform 0.12s ease, filter 0.12s ease;
  }

  .card-btn:hover {
    transform: scale(1.045);
    filter: brightness(1.08) drop-shadow(0 0 14px rgba(255,255,255,0.55));
  }

  .card-btn:active {
    transform: scale(0.96);
    filter: brightness(0.95);
  }

  .card-btn:focus-visible {
    filter: brightness(1.1) drop-shadow(0 0 0 4px #fff);
  }

  /* ---------- Popup toast ---------- */
  #toast {
    position: absolute;
    left: 50%;
    top: 8%;
    transform: translate(-50%, -20px);
    background: linear-gradient(180deg, #ffffff, #f0e9ff);
    color: #5b2a86;
    font-weight: 800;
    font-size: clamp(14px, 2.4vw, 26px);
    padding: 0.7em 1.4em;
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35), 0 0 0 4px rgba(255,255,255,0.5) inset;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    white-space: nowrap;
    z-index: 20;
    text-align: center;
  }

  #toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
</style>
</head>
<body>

  <div id="stage-wrapper">
    <div id="stage">
      <!-- Background video -->
      <video id="bg-video" autoplay muted playsinline webkit-playsinline poster="assets/3tahun/dashboard/bg.jpg">
        <source src="assets/3tahun/dashboard/bg.mp4" type="video/mp4">
        <source src="assets/3tahun/dashboard/bg.webm" type="video/webm">
      </video>
      <div id="toast"></div>
      <!-- Buttons injected by JS from LAYOUT data -->
    </div>
  </div>

<!-- Shared sound utility loaded before page script execution -->
<script src="js/sound.js"></script>

<script>
  // Dynamic layout percentage positions
  const LAYOUT = [
    { id: 1,  label: "COLORS",          img: "assets/3tahun/dashboard/card_1.png",  left: 35.7656, top: 17.1095, width: 16.1483, height: 24.3358 },
    { id: 2,  label: "NUMBERS",         img: "assets/3tahun/dashboard/card_2.png",  left: 52.2727, top: 17.1095, width: 14.2344, height: 24.3358 },
    { id: 3,  label: "DRAWING",         img: "assets/3tahun/dashboard/card_3.png",  left: 66.9258, top: 17.1095, width: 14.2344, height: 24.3358 },
    { id: 4,  label: "SHAPES",          img: "assets/3tahun/dashboard/card_4.png",  left: 81.5191, top: 17.1095, width: 14.6531, height: 24.3358 },
    { id: 5,  label: "ABC ADVENTURES",  img: "assets/3tahun/dashboard/card_5.png",  left: 35.7656, top: 42.0829, width: 16.1483, height: 20.4038 },
    { id: 6,  label: "ANIMAL FUN",      img: "assets/3tahun/dashboard/card_6.png",  left: 52.2727, top: 42.0829, width: 14.2344, height: 20.4038 },
    { id: 7,  label: "PUZZLES",         img: "assets/3tahun/dashboard/card_7.png",  left: 66.9258, top: 42.0829, width: 14.2344, height: 20.4038 },
    { id: 8,  label: "PUZZLE TIME",     img: "assets/3tahun/dashboard/card_8.png",  left: 81.5191, top: 42.0829, width: 14.6531, height: 20.4038 },
    { id: 9,  label: "STORYLAND",       img: "assets/3tahun/dashboard/card_9.png",  left: 35.7656, top: 63.1243, width: 14.8325, height: 23.1668 },
    { id: 10, label: "MATHING MIX",     img: "assets/3tahun/dashboard/card_10.png", left: 51.0766, top: 63.1243, width: 14.4737, height: 23.1668 },
    { id: 11, label: "MUSIC MIX",       img: "assets/3tahun/dashboard/card_11.png", left: 66.0287, top: 63.1243, width: 14.4737, height: 23.1668 },
    { id: 12, label: "ACHIEVEMENTS",    img: "assets/3tahun/dashboard/card_12.png", left: 80.9809, top: 63.1243, width: 13.8158, height: 21.6791 },
  ];

  const stage = document.getElementById('stage');
  const bgVideo = document.getElementById('bg-video');
  const toast = document.getElementById('toast');

  /* ==========================================================================
     STRICT NO-SOUND ENFORCEMENT FOR BACKGROUND VIDEO
     ========================================================================== */
  function enforceNoSound() {
    bgVideo.muted = true;
    bgVideo.volume = 0;
  }

  enforceNoSound();

  bgVideo.addEventListener('volumechange', () => {
    if (!bgVideo.muted || bgVideo.volume !== 0) {
      enforceNoSound();
    }
  });

  /* ==========================================================================
     VIDEO CONFIGURATION & CUSTOM EARLY LOOPING
     ========================================================================== */
  const LOOP_BEFORE_END_SEC = 1.0; 

  bgVideo.addEventListener('timeupdate', () => {
    if (bgVideo.duration && bgVideo.duration > LOOP_BEFORE_END_SEC) {
      const targetEndTime = bgVideo.duration - LOOP_BEFORE_END_SEC;
      if (bgVideo.currentTime >= targetEndTime) {
        bgVideo.currentTime = 0;
        bgVideo.play().catch(() => {});
      }
    }
  });

  function tryPlayVideo() {
    enforceNoSound();
    const playPromise = bgVideo.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => {
        const startPlayOnInteraction = () => {
          enforceNoSound();
          bgVideo.play();
          window.removeEventListener('touchstart', startPlayOnInteraction);
          window.removeEventListener('click', startPlayOnInteraction);
        };
        window.addEventListener('touchstart', startPlayOnInteraction, { once: true });
        window.addEventListener('click', startPlayOnInteraction, { once: true });
      });
    }
  }

  tryPlayVideo();

  bgVideo.addEventListener('error', () => {
    if (bgVideo.error) bgVideo.style.display = 'none';
  });

  /* ==========================================================================
     TOAST & CARD BUTTON BINDINGS (SOUND + INTERACTION)
     ========================================================================== */
  let toastTimer = null;

  function showToast(label) {
    clearTimeout(toastTimer);
    toast.textContent = label + ' coming soon!';
    toast.classList.add('show');
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  /**
   * Safe getter for sound utility to support both window.SmartKiddoSound 
   * and lexical SmartKiddoSound bindings seamlessly.
   */
  function getSound() {
    if (typeof window !== 'undefined' && window.SmartKiddoSound) {
      return window.SmartKiddoSound;
    }
    if (typeof SmartKiddoSound !== 'undefined') {
      return SmartKiddoSound;
    }
    return null;
  }

  /**
   * Binds hover & click interaction sound triggers and toast displays to card buttons cleanly
   */
  function bindCardActions(btn, label) {
    // Hover Sound (Mouse hover on Desktop)
    btn.addEventListener('mouseenter', () => {
      const sound = getSound();
      sound?.playHover?.();
    });

    // Click Sound & Toast Notification (Works on Desktop & Touch Mobile)
    btn.addEventListener('click', () => {
      const sound = getSound();
      sound?.playClick?.();
      showToast(label);
    });
  }

  // Create card buttons dynamically
  LAYOUT.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'card-btn';
    btn.style.left = item.left + '%';
    btn.style.top = item.top + '%';
    btn.style.width = item.width + '%';
    btn.style.height = item.height + '%';
    btn.style.backgroundImage = `url('${item.img}')`;
    btn.setAttribute('aria-label', item.label);
    
    // Bind interaction sounds and toast logic
    bindCardActions(btn, item.label);

    stage.appendChild(btn);
  });
</script>

</body>
</html>

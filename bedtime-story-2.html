<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>SmartKiddo Universe — Cerita Dodoi Vol 2</title>
  <meta name="theme-color" content="#0a0714" />
  
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght=400;600;700;800&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="css/base.css" />
  <style>
    /* Force scrolling and normalize touch parameters on mobile devices */
    html, body {
      overflow: auto !important;
      overflow-y: auto !important;
      height: auto !important;
      min-height: 100vh !important;
      -webkit-overflow-scrolling: touch !important;
      touch-action: auto !important;
    }

    body {
      background-color: #0a0714;
      color: #ffffff;
      font-family: 'Nunito', sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      position: relative;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      width: 100%;
    }
    .title {
      font-family: 'Fredoka', sans-serif;
      font-size: 28px;
      font-weight: 700;
      margin: 0;
      color: #ff914d;
    }
    .back-btn {
      background-color: #1a152e;
      color: #ffffff;
      border: 2px solid #3c2a6b;
      padding: 10px 20px;
      border-radius: 50px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }
    .back-btn:hover {
      background-color: #3c2a6b;
      border-color: #ff914d;
      transform: translateY(-2px);
    }
    
    /* Interactive mobile audio and swipe guidance HUD */
    .pwa-hint-banner {
      background: linear-gradient(135deg, #1d143a 0%, #0f0a25 100%);
      border: 1px solid #3c2a6b;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: pulseBorder 2.5s infinite ease-in-out;
    }
    @keyframes pulseBorder {
      0%, 100% { border-color: #3c2a6b; }
      50% { border-color: #ff914d; }
    }
    .pwa-hint-icon {
      font-size: 24px;
    }
    .pwa-hint-text {
      font-size: 14px;
      line-height: 1.4;
      color: #d1cbe5;
    }
    .pwa-hint-text strong {
      color: #ff914d;
    }

    .embed-wrapper {
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      background-color: #1a152e;
      border: 2px solid #2d234a;
    }
    .attribution-link {
      display: inline-block;
      margin-top: 16px;
      color: #b0a8c9;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }
    .attribution-link:hover {
      color: #ff914d;
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <h1 class="title">Cerita Dodoi Vol 2</h1>
      <a href="home.html" class="back-btn" id="backBtn">
        &lsaquo; Kembali ke Utama
      </a>
    </header>

    <!-- Mobile HUD -->
    <div class="pwa-hint-banner">
      <span class="pwa-hint-icon">🔊</span>
      <div class="pwa-hint-text">
        <strong>PENTING:</strong> Pelayar menyenyapkan bunyi secara lalai. Sila <strong>ketuk ikon pembesar suara</strong> di penjuru video untuk memasang bunyi. Anda boleh <strong>menyapu skrin (swipe)</strong> ke kiri/kanan untuk menukar halaman!
      </div>
    </div>

    <!-- Native Canva Embed Container -->
    <div class="embed-wrapper">
      <div style="position: relative; width: 100%; height: 0; padding-top: 56.2500%; padding-bottom: 0; overflow: hidden; will-change: transform;">
        <!-- Configured to /watch?embed&autoplay=1&loop=1 to enable seamless slide transitions and loop -->
        <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; border: none; padding: 0; margin: 0;"
          src="https://www.canva.com/design/DAHTA5xOXFg/TJDig_f5RHH9RQOvwaprxw/watch?embed&autoplay=1&loop=1" allowfullscreen="allowfullscreen" allow="fullscreen">
        </iframe>
      </div>
    </div>

    <a class="attribution-link" href="https://www.canva.com/design/DAHTA5xOXFg/TJDig_f5RHH9RQOvwaprxw/watch?utm_content=DAHTA5xOXFg&amp;utm_campaign=designshare&amp;utm_medium=embeds&amp;utm_source=link" target="_blank" rel="noopener">
      Barnaby Moonlit Balloon Story Images
    </a> by Tengku Fibo
  </div>

  <script src="js/sound.js"></script>
  <script>
    const backBtn = document.getElementById('backBtn');
    if (backBtn) {
      backBtn.addEventListener('mouseenter', () => {
        if (typeof SmartKiddoSound !== 'undefined') {
          SmartKiddoSound.playHover();
        }
      });
      backBtn.addEventListener('click', (e) => {
        if (typeof SmartKiddoSound !== 'undefined') {
          e.preventDefault();
          SmartKiddoSound.playClick();
          setTimeout(() => {
            window.location.href = backBtn.href;
          }, 150);
        }
      });
    }
  </script>
</body>
</html>

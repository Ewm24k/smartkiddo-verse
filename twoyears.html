<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Learning Adventure!</title>
<script src="assets.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0024;
    font-family: 'Segoe UI', Verdana, Arial, sans-serif;
  }

  #stage-wrapper {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #0a0024;
  }

  #stage {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  #bg-layer {
    position: absolute;
    inset: 0;
    background-repeat: no-repeat;
    background-position: center center;
    background-size: cover;
  }

  button.game-btn {
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
  }

  .game-btn {
    position: absolute;
    border: none;
    outline: none;
    padding: 0;
    margin: 0;
    background-color: transparent;
    background-repeat: no-repeat;
    background-position: center;
    background-size: 100% 100%;
    cursor: pointer;
    transition: transform 0.12s ease, filter 0.12s ease;
  }

  .game-btn:hover {
    transform: scale(1.035);
    filter: brightness(1.08);
  }

  .game-btn:active {
    transform: scale(0.96);
    filter: brightness(0.95);
  }

  .game-btn:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 3px;
    border-radius: 12px;
  }

  /* Mascot layer + idle animation */
  #mascot {
    position: absolute;
    background-repeat: no-repeat;
    background-position: center;
    background-size: 100% 100%;
    pointer-events: none;
    z-index: 5;
    transform-origin: 50% 100%; /* pivot at its feet so it rocks in place */
    animation: mascot-float 3.2s ease-in-out infinite;
  }

  #mascot::after {
    content: "";
    position: absolute;
    left: 8%;
    right: 8%;
    bottom: -6%;
    height: 10%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0) 70%);
    animation: mascot-shadow 3.2s ease-in-out infinite;
  }

  @keyframes mascot-float {
    0%   { transform: translateY(0)     rotate(0deg); }
    25%  { transform: translateY(-2.5%) rotate(-3deg); }
    50%  { transform: translateY(-5%)   rotate(0deg); }
    75%  { transform: translateY(-2.5%) rotate(3deg); }
    100% { transform: translateY(0)     rotate(0deg); }
  }

  @keyframes mascot-shadow {
    0%   { transform: scale(1);    opacity: 0.55; }
    50%  { transform: scale(0.82); opacity: 0.35; }
    100% { transform: scale(1);    opacity: 0.55; }
  }

  /* Modal */
  #modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 0, 30, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    animation: fadeIn 0.15s ease;
  }

  #modal-overlay.open {
    display: flex;
  }

  #modal-box {
    background: linear-gradient(160deg, #2a1a5e, #1a0f3d);
    border: 4px solid rgba(255,255,255,0.25);
    border-radius: 26px;
    padding: 32px 40px;
    max-width: min(90vw, 420px);
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: popIn 0.22s cubic-bezier(.34,1.56,.64,1);
  }

  #modal-emoji {
    font-size: 54px;
    line-height: 1;
    margin-bottom: 10px;
  }

  #modal-title {
    color: #ffd23f;
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 8px;
    text-shadow: 0 2px 0 rgba(0,0,0,0.4);
  }

  #modal-text {
    color: #f0eaff;
    font-size: 16px;
    margin: 0 0 22px;
    line-height: 1.4;
  }

  #modal-close {
    background: #ff6b6b;
    color: white;
    border: none;
    border-radius: 14px;
    padding: 12px 30px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 5px 0 #c94848;
    transition: transform 0.1s ease;
  }

  #modal-close:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #c94848;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<div id="stage-wrapper">
  <div id="stage">
    <div id="bg-layer"></div>
  </div>
</div>

<div id="modal-overlay">
  <div id="modal-box">
    <div id="modal-emoji">🎉</div>
    <h2 id="modal-title">Category</h2>
    <p id="modal-text">Loading fun activities...</p>
    <button id="modal-close">Let's Go!</button>
  </div>
</div>

<script>
  // Button definitions: id, percentage box (left, top, width, height) in the
  // source image's own coordinate space, display name, and a fun emoji.
  const BUTTONS = [
    { id: 'colors',     left: 11.663, top: 33.9,   width: 15.251, height: 31.35,  name: 'Colors',        emoji: '🎨' },
    { id: 'counting',   left: 27.99,  top: 33.9,   width: 15.371, height: 31.35,  name: 'Counting',      emoji: '🔢' },
    { id: 'numbers',    left: 44.737, top: 23.167, width: 13.278, height: 20.191, name: 'Numbers',       emoji: '🔢' },
    { id: 'drawing',    left: 59.39,  top: 23.167, width: 13.577, height: 20.191, name: 'Drawing',       emoji: '✏️' },
    { id: 'shapes',     left: 74.163, top: 23.167, width: 15.072, height: 20.191, name: 'Shapes',        emoji: '🔺' },
    { id: 'abc',        left: 44.737, top: 42.933, width: 13.278, height: 22.104, name: 'ABC Adventures',emoji: '🔤' },
    { id: 'adventures', left: 59.39,  top: 42.933, width: 13.577, height: 22.104, name: 'Adventures',    emoji: '🦁' },
    { id: 'animalfun',  left: 74.163, top: 42.933, width: 15.072, height: 22.104, name: 'Animal Fun',    emoji: '🐘' },
    { id: 'puzzles',    left: 11.663, top: 67.694, width: 15.251, height: 19.554, name: 'Puzzles',       emoji: '🧩' },
    { id: 'puzzletime', left: 27.99,  top: 67.694, width: 15.371, height: 19.554, name: 'Puzzle Time',   emoji: '🧩' },
    { id: 'storyland',  left: 44.737, top: 67.694, width: 13.278, height: 19.554, name: 'Storyland',     emoji: '📖' },
    { id: 'mathingmix', left: 59.39,  top: 67.694, width: 13.577, height: 19.554, name: 'Mathing Mix',   emoji: '➕' },
    { id: 'musicmix',   left: 74.163, top: 67.694, width: 15.072, height: 19.554, name: 'Music Mix',     emoji: '🎵' },
  ];

  const MASCOT = { left: 6.289, top: 10.008, width: 13.144, height: 22.831 };

  // Intrinsic size of the source artwork — the coordinate space that every
  // button/mascot percentage box below is defined against.
  const SRC_W = 1672;
  const SRC_H = 941;

  const stageWrapper = document.getElementById('stage-wrapper');
  const stage = document.getElementById('stage');
  const bgLayer = document.getElementById('bg-layer');
  const modalOverlay = document.getElementById('modal-overlay');
  const modalTitle = document.getElementById('modal-title');
  const modalText = document.getElementById('modal-text');
  const modalEmoji = document.getElementById('modal-emoji');
  const modalClose = document.getElementById('modal-close');

  // Set background from base64 asset (CSS background-size:cover handles the
  // actual image scaling/cropping to fill the screen on any device).
  bgLayer.style.backgroundImage = `url('${ASSETS.bg}')`;

  // Build animated mascot layer
  const mascotEl = document.createElement('div');
  mascotEl.id = 'mascot';
  mascotEl.style.backgroundImage = `url('${ASSETS.mascot}')`;
  stage.appendChild(mascotEl);

  // Build buttons
  const buttonEls = [];
  BUTTONS.forEach(btn => {
    const el = document.createElement('button');
    el.className = 'game-btn';
    el.setAttribute('aria-label', btn.name);
    el.style.backgroundImage = `url('${ASSETS[btn.id]}')`;
    el.addEventListener('click', () => openModal(btn));
    stage.appendChild(el);
    buttonEls.push({ el, def: btn });
  });

  // Position every element to exactly match how the browser renders
  // background-size:cover for #bg-layer — i.e. the image is scaled up
  // uniformly (never distorted) until it fully covers the viewport, then
  // centered, cropping whatever overflows on one axis. Because we replicate
  // that same scale + centering math in JS (in px, not %), buttons stay
  // pixel-locked to the art underneath them at any window size or aspect
  // ratio, edge-to-edge, with zero drift.
  function layout() {
    const vw = stageWrapper.clientWidth;
    const vh = stageWrapper.clientHeight;
    const scale = Math.max(vw / SRC_W, vh / SRC_H);
    const dispW = SRC_W * scale;
    const dispH = SRC_H * scale;
    const offsetX = (vw - dispW) / 2;
    const offsetY = (vh - dispH) / 2;

    function place(el, pctBox) {
      el.style.left = (offsetX + (pctBox.left / 100) * dispW) + 'px';
      el.style.top = (offsetY + (pctBox.top / 100) * dispH) + 'px';
      el.style.width = ((pctBox.width / 100) * dispW) + 'px';
      el.style.height = ((pctBox.height / 100) * dispH) + 'px';
    }

    place(mascotEl, MASCOT);
    buttonEls.forEach(({ el, def }) => place(el, def));
  }

  layout();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', layout);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', layout);
  }

  function openModal(btn) {
    modalEmoji.textContent = btn.emoji;
    modalTitle.textContent = btn.name;
    modalText.textContent = `Get ready for the ${btn.name} activity!`;
    modalOverlay.classList.add('open');
    modalClose.focus();
  }

  function closeModal() {
    modalOverlay.classList.remove('open');
  }

  modalClose.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Adventure!</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #09012a;
    font-family: 'Baloo 2', 'Comic Sans MS', 'Trebuchet MS', sans-serif;
  }

  #stage-wrapper {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #09012a;
    overflow: hidden;
  }

  #stage {
    position: relative;
    aspect-ratio: 1672 / 941;
    width: 100%;
    height: 100%;
    max-width: calc(100vh * 1672 / 941);
    max-height: calc(100vw * 941 / 1672);
    background-repeat: no-repeat;
    background-position: center;
    background-size: 100% 100%;
    /* background-image is set from assets.js at runtime — see script at bottom */
  }

  button {
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
  }

  .mascot,
  .game-btn {
    position: absolute;
    border: none;
    outline: none;
    padding: 0;
    margin: 0;
    background-color: transparent;
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    cursor: pointer;
    /* background-image is set from assets.js at runtime — see script at bottom */
  }

  .mascot {
    z-index: 5;
    transform-origin: center bottom;
    transition: transform 0.25s ease;
    animation: bob 3.2s ease-in-out infinite;
  }
  .mascot:hover {
    transform: scale(1.06) rotate(-2deg);
    animation-play-state: paused;
  }
  .mascot:active {
    transform: scale(0.97) rotate(2deg);
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
  }

  .game-btn {
    z-index: 3;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.35));
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .game-btn:hover {
    transform: scale(1.055);
    filter: drop-shadow(0 8px 14px rgba(0,0,0,0.5)) brightness(1.08);
  }
  .game-btn:active {
    transform: scale(0.94);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)) brightness(0.95);
  }
  .game-btn:focus-visible,
  .mascot:focus-visible {
    outline: 4px solid #fff;
    outline-offset: 3px;
    border-radius: 12%;
  }

  #modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5,0,25,0.72);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(2px);
  }
  #modal-overlay.open {
    display: flex;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  #modal-box {
    background: linear-gradient(160deg, #2a1155, #150836);
    border: 4px solid #ffcf3f;
    border-radius: 24px;
    padding: 2.2vw 3vw;
    text-align: center;
    max-width: 480px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    transform: scale(0.85);
    animation: pop 0.25s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes pop {
    to { transform: scale(1); }
  }
  #modal-box h2 {
    color: #ffe066;
    font-size: clamp(20px, 3vw, 34px);
    margin: 0 0 10px 0;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
  }
  #modal-box p {
    color: #ffffff;
    font-size: clamp(14px, 1.6vw, 18px);
    margin: 0 0 18px 0;
    opacity: 0.9;
  }
  #modal-close {
    background: #ffcf3f;
    color: #2a1155;
    border: none;
    font-weight: 800;
    font-size: clamp(14px, 1.6vw, 18px);
    padding: 10px 28px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  #modal-close:hover {
    transform: scale(1.06);
    background: #ffe066;
  }
</style>
</head>
<body>

<div id="stage-wrapper">
  <div id="stage">
    <button type="button" class="mascot" id="mascot" data-asset="mascot"
      style="left:2.691%; top:3.188%; width:17.943%; height:32.412%;"
      aria-label="Monster mascot"></button>

    
      <button type="button" class="game-btn" id="btn-colors" data-asset="colors" data-label="COLORS"
        style="left:11.663%; top:33.475%; width:15.251%; height:30.818%;"
        aria-label="COLORS"></button>

      <button type="button" class="game-btn" id="btn-counting" data-asset="counting" data-label="COUNTING"
        style="left:27.512%; top:33.475%; width:15.251%; height:30.818%;"
        aria-label="COUNTING"></button>

      <button type="button" class="game-btn" id="btn-numbers" data-asset="numbers" data-label="NUMBERS"
        style="left:44.557%; top:23.911%; width:13.457%; height:18.597%;"
        aria-label="NUMBERS"></button>

      <button type="button" class="game-btn" id="btn-drawing" data-asset="drawing" data-label="DRAWING"
        style="left:60.108%; top:23.911%; width:13.457%; height:18.597%;"
        aria-label="DRAWING"></button>

      <button type="button" class="game-btn" id="btn-shapes" data-asset="shapes" data-label="SHAPES"
        style="left:74.761%; top:23.911%; width:14.653%; height:18.597%;"
        aria-label="SHAPES"></button>

      <button type="button" class="game-btn" id="btn-abc" data-asset="abc" data-label="ABC ADVENTURES"
        style="left:44.557%; top:45.696%; width:13.457%; height:19.129%;"
        aria-label="ABC ADVENTURES"></button>

      <button type="button" class="game-btn" id="btn-adventures" data-asset="adventures" data-label="ADVENTURES"
        style="left:60.108%; top:45.696%; width:13.457%; height:19.129%;"
        aria-label="ADVENTURES"></button>

      <button type="button" class="game-btn" id="btn-animalfun" data-asset="animalfun" data-label="ANIMAL FUN"
        style="left:74.761%; top:45.696%; width:14.653%; height:19.129%;"
        aria-label="ANIMAL FUN"></button>

      <button type="button" class="game-btn" id="btn-puzzles" data-asset="puzzles" data-label="PUZZLES"
        style="left:11.663%; top:68.013%; width:15.251%; height:19.66%;"
        aria-label="PUZZLES"></button>

      <button type="button" class="game-btn" id="btn-puzzletime" data-asset="puzzletime" data-label="PUZZLE TIME"
        style="left:27.512%; top:68.013%; width:15.251%; height:19.66%;"
        aria-label="PUZZLE TIME"></button>

      <button type="button" class="game-btn" id="btn-storyland" data-asset="storyland" data-label="STORYLAND"
        style="left:44.557%; top:68.013%; width:13.457%; height:19.66%;"
        aria-label="STORYLAND"></button>

      <button type="button" class="game-btn" id="btn-storyand" data-asset="storyand" data-label="STORYAND"
        style="left:60.108%; top:68.013%; width:13.457%; height:19.66%;"
        aria-label="STORYAND"></button>

      <button type="button" class="game-btn" id="btn-musicmix" data-asset="musicmix" data-label="MUSIC MIX"
        style="left:74.761%; top:68.013%; width:14.653%; height:19.66%;"
        aria-label="MUSIC MIX"></button>
  </div>
</div>

<div id="modal-overlay">
  <div id="modal-box">
    <h2 id="modal-title">Game</h2>
    <p id="modal-text">Loading fun...</p>
    <button type="button" id="modal-close">Let's go!</button>
  </div>
</div>

<!-- All image data lives in assets.js (base64 data URIs), kept separate from
     this file so the markup/CSS/JS here stays small and readable. -->
<script src="assets.js"></script>
<script src="js/sound.js"></script>
<script src="js/twoyears.js"></script>
<script>
  // Apply images from ASSETS (defined in assets.js) to the stage + every
  // element with a data-asset attribute.
  document.getElementById('stage').style.backgroundImage = `url('${ASSETS.bg}')`;
  document.querySelectorAll('[data-asset]').forEach(el => {
    const key = el.getAttribute('data-asset');
    if (ASSETS[key]) el.style.backgroundImage = `url('${ASSETS[key]}')`;
  });

  const modalOverlay = document.getElementById('modal-overlay');
  const modalTitle = document.getElementById('modal-title');
  const modalText = document.getElementById('modal-text');
  const modalClose = document.getElementById('modal-close');

  function openGame(label) {
    modalTitle.textContent = label;
    modalText.textContent = `Get ready to start the "${label}" activity! (Hook up your game logic or route here.)`;
    modalOverlay.classList.add('open');
    console.log('Button clicked:', label);
  }

  document.querySelectorAll('.game-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      openGame(btn.dataset.label);
    });
  });

  document.getElementById('mascot').addEventListener('click', () => {
    openGame('Hi, I\'m your Learning Buddy!');
  });

  modalClose.addEventListener('click', () => {
    modalOverlay.classList.remove('open');
  });

  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) {
      modalOverlay.classList.remove('open');
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') modalOverlay.classList.remove('open');
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Let's Learn & Have Fun!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { 
    box-sizing: border-box; 
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #0a0028;
    font-family: 'Baloo 2', 'Comic Sans MS', system-ui, -apple-system, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---------- Animated Loading Layer ---------- */
  #loader-layer {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    z-index: 9999;
    background: #0a0028;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    opacity: 1;
    visibility: visible;
    transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.6s ease;
    pointer-events: auto;
  }

  #loader-layer.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  /* Colorful Kid-Friendly Loader Spinner */
  .loader-spinner {
    width: 64px;
    height: 64px;
    border: 6px solid rgba(255, 255, 255, 0.15);
    border-top: 6px solid #ff4757;
    border-right: 6px solid #ffa502;
    border-bottom: 6px solid #2ed573;
    border-left: 6px solid #1e90ff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }

  .loader-text {
    color: #ffffff;
    font-size: clamp(18px, 3.5vw, 28px);
    font-weight: 700;
    letter-spacing: 1px;
    text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    animation: pulse-text 1.2s ease-in-out infinite alternate;
  }

  /* Continue Fullscreen Button */
  .continue-btn {
    display: none;
    margin-top: 10px;
    padding: 14px 44px;
    font-family: inherit;
    font-size: clamp(20px, 4vw, 32px);
    font-weight: 800;
    color: #ffffff;
    background: linear-gradient(135deg, #ff4757, #ff6b81);
    border: 3px solid #ffffff;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(255, 71, 87, 0.6), 0 0 15px rgba(255, 255, 255, 0.4);
    animation: continue-pulse 1.2s ease-in-out infinite alternate;
    transition: transform 0.2s ease, filter 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .continue-btn:hover {
    transform: scale(1.08);
    filter: brightness(1.1);
  }

  .continue-btn:active {
    transform: scale(0.95);
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  @keyframes pulse-text {
    0% { transform: scale(0.96); opacity: 0.8; }
    100% { transform: scale(1.04); opacity: 1; }
  }

  @keyframes continue-pulse {
    0% { transform: scale(0.98); box-shadow: 0 6px 20px rgba(255, 71, 87, 0.5); }
    100% { transform: scale(1.06); box-shadow: 0 10px 30px rgba(255, 71, 87, 0.8), 0 0 20px rgba(255, 255, 255, 0.6); }
  }

  /* ---------- Full Screen Stage Wrapper ---------- */
  #stage-wrapper {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #0a0028;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- 100% Full Width & Full Height Stage ---------- */
  #stage {
    position: absolute;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background-image: url('assets/5tahun/dashboard/bg.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  #stage.ready {
    opacity: 1;
  }

  /* ---------- Modern Top-Left Back Button ---------- */
  .back-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 100;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(25, 12, 60, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 255, 255, 0.25);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 12px rgba(255, 255, 255, 0.15);
    transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), background 0.2s ease, filter 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .back-btn:hover {
    transform: scale(1.1);
    background: rgba(255, 71, 87, 0.9);
    filter: brightness(1.1);
  }

  .back-btn:active {
    transform: scale(0.92);
  }

  /* ---------- 100% EXPANDED FULL SCREEN BACKGROUND VIDEO ---------- */
  #bg-video {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    width: 100%;
    height: 100%;
    min-width: 100%;
    min-height: 100%;
    object-fit: cover;
    object-position: center;
    transform: translate(-50%, -50%);
    z-index: 0;
    pointer-events: none;
    user-select: none;
  }

  /* ---------- Card buttons ---------- */
  .card-btn {
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
    position: absolute;
    z-index: 1;
    border: none;
    outline: none;
    padding: 0;
    margin: 0;
    background-color: transparent;
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    cursor: pointer;
    transition: transform 0.12s ease, filter 0.12s ease;
  }

  .card-btn:hover {
    transform: scale(1.045);
    filter: brightness(1.08) drop-shadow(0 0 14px rgba(255,255,255,0.55));
  }

  .card-btn:active {
    transform: scale(0.96);
    filter: brightness(0.95);
  }

  .card-btn:focus-visible {
    filter: brightness(1.1) drop-shadow(0 0 0 4px #fff);
  }

  /* ==========================================================================
     ANDROID & IOS MOBILE PHONE CARD SCALING (BIGGER CARDS)
     ========================================================================== */
  @media screen and (max-width: 600px) {
    /* Mobile Phones in Portrait */
    .card-btn {
      transform: scaleX(1.30) scaleY(1.15);
      transform-origin: center center;
    }
    .card-row-1 {
      top: calc(var(--base-top) - 2.5%) !important;
    }
    .card-row-3 {
      top: calc(var(--base-top) + 2.5%) !important;
    }
    .card-col-4 {
      left: calc(var(--base-left) - 3.2%) !important;
    }
    .card-col-3 {
      left: calc(var(--base-left) - 1.8%) !important;
    }
    .card-col-2 {
      left: calc(var(--base-left) - 0.8%) !important;
    }
  }

  @media screen and (max-height: 500px) and (max-width: 930px) {
    /* Mobile Phones in Landscape */
    .card-btn {
      transform: scaleX(1.22) scaleY(1.10);
      transform-origin: center center;
    }
    .card-row-1 {
      top: calc(var(--base-top) - 1.8%) !important;
    }
    .card-row-3 {
      top: calc(var(--base-top) + 1.8%) !important;
    }
    .card-col-4 {
      left: calc(var(--base-left) - 2.5%) !important;
    }
    .card-col-3 {
      left: calc(var(--base-left) - 1.2%) !important;
    }
    .card-col-2 {
      left: calc(var(--base-left) - 0.5%) !important;
    }
  }

  /* ---------- Popup toast ---------- */
  #toast {
    position: absolute;
    left: 50%;
    top: 8%;
    transform: translate(-50%, -20px);
    background: linear-gradient(180deg, #ffffff, #f0e9ff);
    color: #5b2a86;
    font-weight: 800;
    font-size: clamp(14px, 2.4vw, 26px);
    padding: 0.7em 1.4em;
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35), 0 0 0 4px rgba(255,255,255,0.5) inset;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    white-space: nowrap;
    z-index: 20;
    text-align: center;
  }

  #toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  /* ==========================================================================
     INLINE BUILT-IN MUSIC PLAYER WIDGET STYLES
     ========================================================================== */
  .music-widget {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 500;
    display: flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, rgba(30, 15, 70, 0.95), rgba(10, 0, 40, 0.95));
    border: 2px solid #ff4757;
    border-radius: 999px;
    padding: 8px 18px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 16px rgba(255, 71, 87, 0.4);
    transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.45s ease;
  }

  .music-widget.is-minimized {
    transform: translate(-50%, 75px);
    opacity: 0;
    pointer-events: none;
  }

  .mw-btn {
    background: rgba(255, 255, 255, 0.15);
    border: none;
    color: #ffffff;
    font-size: 14px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .mw-btn:hover {
    background: #ff4757;
    transform: scale(1.12);
  }

  .mw-btn:active {
    transform: scale(0.92);
  }

  .mw-close-btn {
    font-weight: 800;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.7);
  }

  .mw-play-btn {
    background: #ff4757;
    font-size: 15px;
    box-shadow: 0 4px 12px rgba(255, 71, 87, 0.5);
  }

  .mw-info {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #ffffff;
    font-size: 14px;
    font-weight: 700;
    max-width: 170px;
  }

  .mw-icon {
    font-size: 16px;
  }

  .mw-title {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.5px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  }

  .mw-reopen-btn {
    position: absolute;
    bottom: 20px;
    right: 20px;
    z-index: 500;
    background: linear-gradient(135deg, #ff4757, #ff6b81);
    border: 2px solid #ffffff;
    color: #ffffff;
    font-size: 20px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease;
    opacity: 0;
    pointer-events: none;
    transform: scale(0.8);
  }

  .mw-reopen-btn.is-visible {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
  }

  .mw-reopen-btn:hover {
    transform: scale(1.15);
  }
</style>
</head>
<body>

  <!-- Animated Preloader Layer -->
  <div id="loader-layer">
    <div id="loader-spinner" class="loader-spinner"></div>
    <div id="loader-text" class="loader-text">Loading Fun...</div>
    <button id="continue-btn" class="continue-btn" aria-label="Continue to Game">CONTINUE ▶</button>
  </div>

  <div id="stage-wrapper">
    <div id="stage">
      <!-- Modern Top-Left Back Button -->
      <button id="back-btn" class="back-btn" aria-label="Go Back" title="Go Back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>

      <!-- Full-Screen Video Background with Mobile Inline Compatibility Attributes -->
      <video id="bg-video" autoplay muted playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5-page" x5-video-player-fullscreen="true" poster="assets/5tahun/dashboard/bg.jpg">
        <source src="assets/5tahun/dashboard/bg.mp4" type="video/mp4">
        <source src="assets/5tahun/dashboard/bg.webm" type="video/webm">
      </video>

      <div id="toast"></div>

      <!-- Built-In Floating Music Player Widget -->
      <div id="music-widget" class="music-widget is-minimized">
        <button id="mw-toggle-btn" class="mw-btn mw-close-btn" title="Minimize Music Player">✕</button>
        <div class="mw-info">
          <span class="mw-icon">🎵</span>
          <span id="mw-track-title" class="mw-title">Loading Music...</span>
        </div>
        <button id="mw-play-btn" class="mw-btn mw-play-btn" title="Play or Pause">▶</button>
        <button id="mw-next-btn" class="mw-btn" title="Next Song">⏭</button>
      </div>

      <!-- Floating Music Re-Open Button -->
      <button id="mw-reopen-btn" class="mw-reopen-btn is-visible" title="Open Music Player">
        <span>🎵</span>
      </button>

      <!-- Hidden Built-In Audio Engine -->
      <audio id="bg-music-audio" preload="auto"></audio>

      <!-- Card buttons injected by JS from LAYOUT data -->
    </div>
  </div>

<!-- Shared UI Sound Utility -->
<script src="js/sound.js"></script>

<script>
  // 5years Dashboard layout positions
  const LAYOUT = [
    { id: 1,  label: "COLORS",          img: "assets/5tahun/dashboard/card_1.png",  left: 39.8438, top: 16.7969, width: 14.5833, height: 20.7031 },
    { id: 2,  label: "NUMBERS",         img: "assets/5tahun/dashboard/card_2.png",  left: 55.4688, top: 16.7969, width: 13.8021, height: 20.7031 },
    { id: 3,  label: "DRAWING",         img: "assets/5tahun/dashboard/card_3.png",  left: 70.1823, top: 16.7969, width: 13.2812, height: 20.7031 },
    { id: 4,  label: "SHAPES",          img: "assets/5tahun/dashboard/card_4.png",  left: 83.724,  top: 16.7969, width: 12.8906, height: 20.7031 },
    { id: 5,  label: "ABC ADVENTURES",  img: "assets/5tahun/dashboard/card_5.png",  left: 39.8438, top: 38.4766, width: 14.3229, height: 19.1406 },
    { id: 6,  label: "ANIMAL FUN",      img: "assets/5tahun/dashboard/card_6.png",  left: 54.8177, top: 38.4766, width: 13.6719, height: 19.1406 },
    { id: 7,  label: "PUZZLES",         img: "assets/5tahun/dashboard/card_7.png",  left: 69.6615, top: 38.4766, width: 13.6068, height: 19.1406 },
    { id: 8,  label: "PUZZLE TIME",     img: "assets/5tahun/dashboard/card_8.png",  left: 83.6589, top: 38.4766, width: 13.2161, height: 19.1406 },
    { id: 9,  label: "STORYLAND",       img: "assets/5tahun/dashboard/card_9.png",  left: 39.7135, top: 58.2031, width: 13.9323, height: 20.5078 },
    { id: 10, label: "MATCHING MIX",    img: "assets/5tahun/dashboard/card_10.png", left: 54.6875, top: 58.2031, width: 13.9323, height: 20.5078 },
    { id: 11, label: "MUSIC MIX",       img: "assets/5tahun/dashboard/card_11.png", left: 69.5312, top: 58.2031, width: 13.737,  height: 20.5078 },
    { id: 12, label: "ACHIEVEMENTS",    img: "assets/5tahun/dashboard/card_12.png", left: 83.5286, top: 58.2031, width: 13.4766, height: 20.5078 },
  ];

  const stage = document.getElementById('stage');
  const bgVideo = document.getElementById('bg-video');
  const toast = document.getElementById('toast');
  const loaderLayer = document.getElementById('loader-layer');
  const loaderSpinner = document.getElementById('loader-spinner');
  const loaderText = document.getElementById('loader-text');
  const continueBtn = document.getElementById('continue-btn');

  /* ==========================================================================
     FULLSCREEN REQUEST HELPER
     ========================================================================== */
  function requestFullScreen() {
    const el = document.documentElement;
    const rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (typeof rfs === 'function') {
      try {
        rfs.call(el).catch(() => {});
      } catch (e) {}
    }
  }

  /* ==========================================================================
     BACK BUTTON NAVIGATION LOGIC
     ========================================================================== */
  const backBtn = document.getElementById('back-btn');
  if (backBtn) {
    backBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      getSound()?.playClick?.();
      setTimeout(() => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = 'index.html';
        }
      }, 150);
    });
  }

  /* ==========================================================================
     STRICT NO-SOUND ENFORCEMENT & FULLSCREEN STRETCH FOR BACKGROUND VIDEO
     ========================================================================== */
  function enforceNoSound() {
    bgVideo.muted = true;
    bgVideo.volume = 0;
  }

  enforceNoSound();

  bgVideo.addEventListener('volumechange', () => {
    if (!bgVideo.muted || bgVideo.volume !== 0) {
      enforceNoSound();
    }
  });

  // Dynamic Full-Width/Height Resize Engine for Video
  function expandBgVideo() {
    if (!bgVideo) return;
    const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
    const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);
    bgVideo.style.width = vw + 'px';
    bgVideo.style.height = vh + 'px';
  }

  window.addEventListener('resize', expandBgVideo);
  window.addEventListener('orientationchange', () => setTimeout(expandBgVideo, 250));
  expandBgVideo();

  /* ==========================================================================
     VIDEO CONFIGURATION & CUSTOM EARLY LOOPING
     ========================================================================== */
  const LOOP_BEFORE_END_SEC = 1.0; 

  bgVideo.addEventListener('timeupdate', () => {
    if (bgVideo.duration && bgVideo.duration > LOOP_BEFORE_END_SEC) {
      const targetEndTime = bgVideo.duration - LOOP_BEFORE_END_SEC;
      if (bgVideo.currentTime >= targetEndTime) {
        bgVideo.currentTime = 0;
        bgVideo.play().catch(() => {});
      }
    }
  });

  function tryPlayVideo() {
    enforceNoSound();
    const playPromise = bgVideo.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => {
        const startPlayOnInteraction = () => {
          enforceNoSound();
          bgVideo.play();
          window.removeEventListener('touchstart', startPlayOnInteraction);
          window.removeEventListener('click', startPlayOnInteraction);
        };
        window.addEventListener('touchstart', startPlayOnInteraction, { once: true });
        window.addEventListener('click', startPlayOnInteraction, { once: true });
      });
    }
  }

  tryPlayVideo();

  bgVideo.addEventListener('error', () => {
    if (bgVideo.error) bgVideo.style.display = 'none';
  });

  /* ==========================================================================
     TOAST & CARD BUTTON BINDINGS (SOUND + INTERACTION)
     ========================================================================== */
  let toastTimer = null;

  function showToast(label) {
    clearTimeout(toastTimer);
    toast.textContent = label + ' coming soon!';
    toast.classList.add('show');
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  function getSound() {
    if (typeof window !== 'undefined' && window.SmartKiddoSound) return window.SmartKiddoSound;
    if (typeof SmartKiddoSound !== 'undefined') return SmartKiddoSound;
    return null;
  }

  function bindCardActions(btn, label) {
    btn.addEventListener('mouseenter', () => {
      getSound()?.playHover?.();
    });

    btn.addEventListener('click', () => {
      getSound()?.playClick?.();
      showToast(label);
    });
  }

  // Create card buttons dynamically with column & row classes
  LAYOUT.forEach((item, index) => {
    const btn = document.createElement('button');
    const colNum = (index % 4) + 1;
    const rowNum = Math.floor(index / 4) + 1;
    btn.className = `card-btn card-col-${colNum} card-row-${rowNum}`;
    btn.style.left = item.left + '%';
    btn.style.top = item.top + '%';
    btn.style.width = item.width + '%';
    btn.style.height = item.height + '%';
    btn.style.setProperty('--base-left', item.left + '%');
    btn.style.setProperty('--base-top', item.top + '%');
    btn.style.backgroundImage = `url('${item.img}')`;
    btn.setAttribute('aria-label', item.label);
    
    bindCardActions(btn, item.label);
    stage.appendChild(btn);
  });

  /* ==========================================================================
     INSTANT AUTOPLAY MUSIC ENGINE WITH SEAMLESS AUTO-NEXT TRACK
     ========================================================================== */
  let globalUnmuteAndPlay = function() {};

  (function initBuiltInMusicPlayer() {
    const audio = document.getElementById('bg-music-audio');
    const widget = document.getElementById('music-widget');
    const reopenBtn = document.getElementById('mw-reopen-btn');
    const playBtn = document.getElementById('mw-play-btn');
    const nextBtn = document.getElementById('mw-next-btn');
    const closeBtn = document.getElementById('mw-toggle-btn');
    const titleEl = document.getElementById('mw-track-title');

    audio.muted = true;
    audio.volume = 0.5;

    // Embedded fallback playlist for 5tahun
    const playlist = [
      { name: "Background Song 1", src: "assets/5tahun/dashboard/music/bgm.mp3" },
      { name: "Background Song 2", src: "assets/audio/music/bgm.mp3" }
    ];

    let trackIndex = 0;
    let autoHideTimer = null;

    const playlistPaths = [
      "assets/5tahun/dashboard/music/playlist.json",
      "assets/audio/music/playlist.json"
    ];

    async function loadPlaylistJson() {
      for (const path of playlistPaths) {
        try {
          const res = await fetch(path);
          if (res.ok) {
            const data = await res.json();
            const list = (data && data.tracks) || (Array.isArray(data) ? data : []);
            if (list.length > 0) {
              playlist.length = 0;
              list.forEach(item => {
                const fileName = typeof item === 'string' ? item : item.file;
                const cleanName = fileName.replace(/\.(mp3|wav|ogg)$/i, "");
                playlist.push({
                  name: cleanName,
                  src: `assets/5tahun/dashboard/music/${fileName}`
                });
              });
              break;
            }
          }
        } catch (err) {}
      }
      playTrackAtIndex(0);
    }

    function updatePlayBtnIcon() {
      playBtn.textContent = audio.paused ? "▶" : "⏸";
    }

    function playTrackAtIndex(index) {
      if (!playlist.length) return;
      trackIndex = (index % playlist.length + playlist.length) % playlist.length;
      const current = playlist[trackIndex];
      titleEl.textContent = current.name;
      audio.src = current.src;
      
      audio.load();

      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          updatePlayBtnIcon();
        }).catch(() => {
          const onCanPlay = () => {
            audio.play().then(updatePlayBtnIcon).catch(() => {});
          };
          audio.addEventListener('canplay', onCanPlay, { once: true });
        });
      }
    }

    function unmuteAndPlay() {
      audio.muted = false;
      if (audio.paused) {
        audio.play().then(updatePlayBtnIcon).catch(() => {});
      }
      updatePlayBtnIcon();
    }

    globalUnmuteAndPlay = unmuteAndPlay;

    function pauseMusic() {
      audio.pause();
      updatePlayBtnIcon();
    }

    function showWidget() {
      widget.classList.remove('is-minimized');
      reopenBtn.classList.remove('is-visible');
      startAutoHideTimer();
    }

    function hideWidget() {
      clearTimeout(autoHideTimer);
      widget.classList.add('is-minimized');
      reopenBtn.classList.add('is-visible');
    }

    function startAutoHideTimer() {
      clearTimeout(autoHideTimer);
      autoHideTimer = setTimeout(() => {
        hideWidget();
      }, 5000);
    }

    window.addEventListener('mousemove', (e) => {
      const bottomThreshold = window.innerHeight - 90;
      if (e.clientY >= bottomThreshold && widget.classList.contains('is-minimized')) {
        showWidget();
      }
    });

    document.addEventListener('click', (e) => {
      const isCardBtn = e.target.closest('.card-btn');
      const isWidget = e.target.closest('#music-widget');
      const isReopenBtn = e.target.closest('#mw-reopen-btn');
      const isBackBtn = e.target.closest('#back-btn');
      const isContinueBtn = e.target.closest('#continue-btn');
      
      if (!isCardBtn && !isWidget && !isReopenBtn && !isBackBtn && !isContinueBtn) {
        showWidget();
      }
    });

    reopenBtn.addEventListener('click', () => {
      getSound()?.playClick?.();
      showWidget();
    });

    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      getSound()?.playClick?.();
      hideWidget();
    });

    widget.addEventListener('mouseenter', () => clearTimeout(autoHideTimer));
    widget.addEventListener('mouseleave', () => {
      if (!widget.classList.contains('is-minimized')) {
        startAutoHideTimer();
      }
    });

    playBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      getSound()?.playClick?.();
      if (audio.paused) {
        unmuteAndPlay();
      } else {
        pauseMusic();
      }
      startAutoHideTimer();
    });

    nextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      getSound()?.playClick?.();
      unmuteAndPlay();
      playTrackAtIndex(trackIndex + 1);
      startAutoHideTimer();
    });

    audio.addEventListener('ended', () => {
      audio.muted = false;
      playTrackAtIndex(trackIndex + 1);
    });

    audio.addEventListener('play', updatePlayBtnIcon);
    audio.addEventListener('pause', updatePlayBtnIcon);

    audio.addEventListener('error', () => {
      if (playlist[trackIndex] && playlist[trackIndex].src.includes('assets/5tahun/dashboard/music/')) {
        playlist[trackIndex].src = `assets/audio/music/${playlist[trackIndex].name}.mp3`;
        audio.src = playlist[trackIndex].src;
        audio.play().catch(() => {});
      }
    });

    playTrackAtIndex(0);
    loadPlaylistJson();

    const unlockUnmute = () => {
      unmuteAndPlay();
      window.removeEventListener('pointerdown', unlockUnmute);
      window.removeEventListener('touchstart', unlockUnmute);
      window.removeEventListener('click', unlockUnmute);
      window.removeEventListener('mousemove', unlockUnmute);
      window.removeEventListener('keydown', unlockUnmute);
    };

    window.addEventListener('pointerdown', unlockUnmute, { passive: true });
    window.addEventListener('touchstart', unlockUnmute, { passive: true });
    window.addEventListener('click', unlockUnmute);
    window.addEventListener('mousemove', unlockUnmute, { passive: true });
    window.addEventListener('keydown', unlockUnmute, { passive: true });
  })();

  /* ==========================================================================
     PRELOADER ENGINE & CONTINUE FULLSCREEN TRIGGER
     ========================================================================== */
  let isLoaded = false;

  function showContinueButton() {
    if (isLoaded) return;
    isLoaded = true;

    if (loaderSpinner) loaderSpinner.style.display = 'none';
    if (loaderText) loaderText.style.display = 'none';
    if (continueBtn) continueBtn.style.display = 'inline-block';
  }

  if (continueBtn) {
    continueBtn.addEventListener('click', () => {
      getSound()?.playClick?.();
      
      requestFullScreen();

      if (typeof globalUnmuteAndPlay === 'function') {
        globalUnmuteAndPlay();
      }

      stage.classList.add('ready');
      loaderLayer.classList.add('hidden');
    });
  }

  function preloadAssets() {
    const imageUrls = [
      'assets/5tahun/dashboard/bg.jpg',
      ...LAYOUT.map(item => item.img)
    ];

    const imagePromises = imageUrls.map(url => {
      return new Promise((resolve) => {
        const img = new Image();
        img.src = url;
        img.onload = () => resolve(url);
        img.onerror = () => resolve(url);
      });
    });

    const videoPromise = new Promise((resolve) => {
      if (bgVideo.readyState >= 3) {
        resolve();
      } else {
        const onVideoReady = () => {
          bgVideo.removeEventListener('canplaythrough', onVideoReady);
          bgVideo.removeEventListener('error', onVideoReady);
          resolve();
        };
        bgVideo.addEventListener('canplaythrough', onVideoReady);
        bgVideo.addEventListener('error', onVideoReady);
      }
    });

    const timeoutPromise = new Promise((resolve) => setTimeout(resolve, 2800));

    Promise.race([
      Promise.all([...imagePromises, videoPromise]),
      timeoutPromise
    ]).then(() => {
      showContinueButton();
    });
  }

  if (document.readyState === 'complete') {
    preloadAssets();
  } else {
    window.addEventListener('load', preloadAssets);
  }
</script>

</body>
</html>
